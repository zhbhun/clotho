<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Marketplace 缓存状态演示</title><style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:0 24px;color:#20252c}h1{font-size:26px}section{border:1px solid #d9dfe6;border-radius:12px;padding:20px;margin:18px 0}button{background:#fff;border:1px solid #bac5d2;border-radius:6px;padding:9px;margin:4px;cursor:pointer}.accent{color:#2759a6}p{line-height:1.6}#steps button:disabled{opacity:.4}</style>
<h1>Marketplace 缓存状态演示</h1><p>临时原型：再次进入时先显示旧列表、后台更新，是否能清楚处理失败和旧请求覆盖操作？按钮模拟结果，并不连接真实插件。</p><section><h2>当前状态</h2><div id="state"></div></section><section><h2>自由操作</h2><div id="actions"></div></section><section><h2>引导体验</h2><div id="tabs"></div><p id="guide"></p><div id="steps"></div></section>
<script>
const initial=()=>({cache:null,installed:false,pending:null,version:0,error:false,visible:false,note:'尚未进入 Marketplace'})
function reduce(s,a){s={...s};if(a==='reset')return initial();if(a==='visit'){s.visible=true;s.pending={version:s.version,installed:s.installed};s.error=false;s.note='已进入；正在读取最新结果'}if(a==='leave'){s.visible=false;s.note='已离开'}if(a==='success'&&s.pending){if(s.pending.version===s.version){s.cache='示例插件';s.installed=s.pending.installed;s.error=false;s.note='最新结果已更新'}else s.note='旧请求结果已忽略';s.pending=null}if(a==='fail'&&s.pending){s.pending=null;s.error=true;s.note='读取失败；保留已有结果'}if(a==='install'){s.installed=true;s.version++;s.note='安装成功；旧请求不能覆盖安装状态'}return s}
</script><script>
let s=initial();const labels={visit:'进入 Marketplace',leave:'离开页面',success:'读取成功',fail:'读取失败',install:'模拟安装成功',reset:'重新开始'};const scenarios=[{title:'首次进入和再次进入',description:'第一次等待，之后立即显示已有列表。',actions:['visit','success','leave','visit','success']},{title:'后台读取失败',description:'有缓存时失败不会清空列表，重新进入可重试。',actions:['visit','success','leave','visit','fail','leave','visit','success']},{title:'旧请求遇到安装',description:'请求开始后完成安装，再让旧结果返回，安装状态应保留。',actions:['visit','success','leave','visit','install','success']}];let selected=0,step=0;function dispatch(a){s=reduce(s,a);render()}function render(){document.querySelector('#state').innerHTML=`<p>页面：${s.visible?'已打开':'未打开'}<br>列表：${!s.visible?'未显示':s.cache??(s.pending?'加载中…':s.error?'读取失败':'暂无数据')}<br>安装状态：${s.installed?'已安装':'未安装'}<br>后台读取：${s.pending?'进行中':'无'}<br>错误提示：${s.error?'读取失败':'无'}<br><span class="accent">${s.note}</span></p>`;document.querySelector('#actions').innerHTML=Object.entries(labels).map(([k,v])=>`<button data-action="${k}">${v}</button>`).join('');document.querySelector('#tabs').innerHTML=scenarios.map((x,i)=>`<button data-tab="${i}">${x.title}</button>`).join('');let sc=scenarios[selected];document.querySelector('#guide').textContent=sc.description;document.querySelector('#steps').innerHTML=sc.actions.map((a,i)=>`<button data-step="${i}" ${i!==step?'disabled':''}>${i+1}. ${labels[a]}</button>`).join('');document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>dispatch(b.dataset.action));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{selected=+b.dataset.tab;step=0;s=initial();render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{s=reduce(s,sc.actions[step++]);render()})}render()
</script></html>
