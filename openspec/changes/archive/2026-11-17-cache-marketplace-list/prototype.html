<!doctype html><html lang="en"><meta charset="utf-8"><title>Marketplace cache prototype</title><style>body{font:16px system-ui;max-width:720px;margin:50px auto;line-height:1.5}button{padding:8px;margin:4px}section{background:#f3f5f6;padding:16px;margin:16px 0}</style><h1>Marketplace cache prototype</h1><p>Can a returning visit show the last list while refreshing, including an empty list or a failed refresh?</p><section id="state"></section><div id="buttons"></div><h2>Guided walkthroughs</h2><p>First visit: Open → Success. Return with failure: Open → Failure. Empty result: Open → Empty → Open.</p><script>
const initial={cached:null,loading:false,error:false,visible:false};let state=initial;function reduce(s,a){switch(a){case'Open':return {...s,visible:true,loading:true,error:false};case'Close':return {...s,visible:false};case'Success':return {...s,cached:['official','community'],loading:false};case'Empty':return {...s,cached:[],loading:false};case'Failure':return {...s,loading:false,error:true};case'Reset':return initial}}function render(){document.querySelector('#state').innerHTML=`<b>Visible:</b> ${state.visible}<br><b>Shown list:</b> ${state.cached===null?'none':state.cached.join(', ')||'empty'}<br><b>Blocking loading:</b> ${state.visible&&state.loading&&state.cached===null}<br><b>Background refresh:</b> ${state.loading&&state.cached!==null}<br><b>Error:</b> ${state.error}`};for(const a of ['Open','Close','Success','Empty','Failure','Reset']){const b=document.createElement('button');b.textContent=a;b.onclick=()=>{state=reduce(state,a);render()};document.querySelector('#buttons').append(b)}render()
</script></html>
