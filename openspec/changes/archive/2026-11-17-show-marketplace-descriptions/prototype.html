<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>市场描述 · 临时原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:flex;min-height:100vh}.sidebar{width:210px;padding:27px 14px;background:#eee;color:#555;flex:none}.back{margin-bottom:36px;color:#777}.section{margin:22px 10px 8px;font-size:12px;color:#888}.item{padding:9px 12px;border-radius:8px}.active{background:#fff;color:#111}.main{flex:1;background:#fff;padding:46px 44px 100px}.content{max-width:820px;margin:auto}.tabs{display:flex;justify-content:center;margin-bottom:28px}.tabs-inner{background:#f1f1f1;border-radius:10px;padding:4px;display:flex;gap:4px;color:#777}.tabs-inner span{padding:5px 12px}.tabs-inner .selected{background:white;color:#111;border-radius:8px;box-shadow:0 1px 2px #0001}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}.count{color:#999;font-weight:400}.actions{display:flex;gap:8px}.action{padding:7px 12px;border:1px solid #e1e1e1;border-radius:8px;background:white;color:#222;font:inherit;font-weight:400}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}.list.single{grid-template-columns:minmax(0,1fr)}.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px;min-width:0}.row:hover{background:#f5f5f5}.avatar{display:flex;width:36px;height:36px;flex:none;align-items:center;justify-content:center;border-radius:8px;background:hsl(var(--hue) 70% 90%);color:hsl(var(--hue) 46% 34%);font-weight:500}.list.no-avatar .avatar{display:none}.body{min-width:0;flex:1}.name{font-weight:500;font-size:15px;line-height:1.35}.description,.source{font-size:13px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.description{color:#666;margin-top:3px}.source{color:#999;margin-top:3px}.chevron{font-size:21px;color:#999}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(135px,31%);align-items:center;gap:20px}.split .source{text-align:right}.picker{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:#222;color:#fff;box-shadow:0 5px 20px #0003;font-size:13px}.picker button{border:0;border-radius:7px;background:#404040;color:white;padding:7px 12px;cursor:pointer}.picker strong{min-width:235px;text-align:center}.explain{margin:18px 2px;color:#777;line-height:1.5;font-size:12px}@media(max-width:1100px){.list{grid-template-columns:minmax(0,1fr)}}@media(max-width:650px){.sidebar{display:none}.main{padding:30px 18px 110px}.split{grid-template-columns:minmax(0,1fr)}.split .source{text-align:left}.picker strong{min-width:0}}
</style>
</head>
<body><div class="shell"><aside class="sidebar"><div class="back">‹　Back to app</div><div class="section">Settings</div><div class="item">General</div><div class="item">Models</div><div class="item">Appearance</div><div class="item">Keyboard shortcuts</div><div class="item">Projects</div><div class="section">Agent capabilities</div><div class="item active">Marketplace</div><div class="item">Plugins</div><div class="item">Subagents</div><div class="item">MCP</div><div class="item">Skills</div></aside><main class="main"><div class="content"><div class="tabs"><div class="tabs-inner"><span>Plugins</span><span class="selected">Marketplaces</span></div></div><div class="toolbar"><div>Registered <span class="count">5 items</span></div><div class="actions"><span class="action">Add marketplace</span><span class="action">•••</span></div></div><div class="list" id="list"></div><div class="explain" id="explain"></div></div></main></div><nav class="picker" aria-label="切换布局"><button id="prev">←</button><strong id="variant"></strong><button id="next">→</button></nav>
<script>
const entries=[
{name:'caveman',source:'github · JuliusBrussee/caveman',description:'Ultra-compressed communication mode. Shortens prose while preserving technical terms, code, commands, and exact errors.'},
{name:'chrome-devtools-plugins',source:'github · ChromeDevTools/chrome-devtools-mcp',description:'Bundled plugins for actuating and debugging the Chrome browser.'},
{name:'claude-plugins-official',source:'github · anthropics/claude-plugins-official',description:'Directory of popular Claude Code extensions including development tools, productivity plugins, and MCP integrations'},
{name:'superpowers-marketplace',source:'github · obra/superpowers-marketplace',description:'Skills, workflows, and productivity tools'},
{name:'zhbhun',source:'directory · ~/Projects/zhbhun/trading',description:'Marketplace for the trading multi-agent analysis plugin'}];
const layouts=[{key:'a',name:'A · 双列、字母图标',explain:'沿用插件列表：双列、字母图标、名称、描述和来源；窄窗口自动变为单列。'}, {key:'b',name:'B · 双列、无图标',explain:'双列无卡片布局，以文字为主，省略字母图标。'}, {key:'c',name:'C · 单列、字母图标',explain:'沿用插件列表的条目样式，但固定单列，给来源和描述更多宽度。'}];
let current=Math.max(0,layouts.findIndex(x=>x.key===new URLSearchParams(location.search).get('variant')));const list=document.querySelector('#list'),label=document.querySelector('#variant'),explain=document.querySelector('#explain');function row(item){const d=document.createElement('div');d.className='row';const avatar=document.createElement('div');avatar.className='avatar';let hash=0;for(const c of item.name)hash=(hash*31+c.charCodeAt(0))>>>0;avatar.style.setProperty('--hue',Math.round((hash*137.508)%360)%360);avatar.textContent=item.name[0].toUpperCase();const inner=document.createElement('div');inner.className='body';const name=document.createElement('div');name.className='name';name.textContent=item.name;const description=document.createElement('div');description.className='description';description.textContent=item.description;const source=document.createElement('div');source.className='source';source.textContent=item.source;inner.append(name,description,source);const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';d.append(avatar,inner,arrow);return d}function render(){list.className='list'+(current===1?' no-avatar':'')+(current===2?' single':'');list.replaceChildren(...entries.map(row));label.textContent=layouts[current].name;explain.textContent='临时原型 · '+layouts[current].explain;try{let u=new URL(location.href);u.searchParams.set('variant',layouts[current].key);history.replaceState(null,'',u)}catch{}}function advance(offset){current=(current+offset+layouts.length)%layouts.length;render()}document.querySelector('#prev').onclick=()=>advance(-1);document.querySelector('#next').onclick=()=>advance(1);document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')advance(-1);if(event.key==='ArrowRight')advance(1)});render();
</script></body></html>
