<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clotho Marketplace prototype</title>
<style>
:root{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242424;background:#e8e8e7}*{box-sizing:border-box}body{margin:0}.window{display:flex;min-height:100vh;background:white}.sidebar{width:236px;flex:none;background:#ededec;padding:22px 10px;color:#484848}.traffic{display:flex;gap:8px;margin:0 0 26px 4px}.traffic i{height:12px;width:12px;border-radius:50%;background:#fa5f57}.traffic i:nth-child(2){background:#fdbc2e}.traffic i:nth-child(3){background:#28c840}.back{padding:9px 8px 18px;color:#777}.group{padding:14px 8px 6px;color:#8a8a8a;font-size:12px}.nav{padding:8px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center}.nav.active{background:#fff;color:#191919;font-weight:600}.nav span{width:16px;text-align:center;color:#777}.main{flex:1;min-width:0}.top{height:40px;display:flex;align-items:center;border-bottom:1px solid #f2f2f2;padding:0 26px;color:#777;font-size:13px}.content{max-width:820px;margin:55px auto;padding:0 24px 110px}h1{font-size:24px;margin:0 0 8px;letter-spacing:-.03em}h2{font-size:15px;margin:0}.subtitle{color:#858585;font-size:14px;margin:0 0 24px}.market-header{display:flex;justify-content:center;margin-bottom:24px}.market-tabs{display:flex;gap:2px;flex:none;background:#f1f1f0;padding:3px;border-radius:8px}.market-tabs .tab{padding:5px 12px;border-radius:6px;color:#777}.market-tabs .tab.active{background:white;color:#242424;box-shadow:0 1px 3px #0002}.market-tabs .tab.active:after{display:none}.titlebar,.toolbar,.row,.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:16px}.titlebar{align-items:flex-start}button,select,input{font:inherit}button{cursor:pointer}button.action{border:1px solid #ddd;background:white;border-radius:7px;padding:7px 12px;color:#333}.primary{background:#242424!important;color:white!important;border-color:#242424!important}.tabs{display:flex;gap:25px;border-bottom:1px solid #e9e9e9;margin-bottom:22px}.tab{border:0;background:none;color:#888;padding:0 0 10px;position:relative}.tab.active{font-weight:600;color:#222}.tab.active:after{content:"";height:2px;background:#222;position:absolute;bottom:-1px;left:0;right:0}.toolbar{margin:4px 0 18px}.toolbar select,.toolbar input{height:34px;border:1px solid #e1e1e1;background:#fff;border-radius:7px;color:#555;padding:0 10px}.toolbar select{width:164px}.toolbar input{width:220px}.row{padding:12px 8px;border-radius:7px}.row:hover{background:#f7f7f7}.rowbody{min-width:0;flex:1}.name{font-size:15px;font-weight:500}.description,.meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#888;margin-top:5px}.meta{font-size:12px}.iconbutton{border:0;background:none;color:#888;font-size:21px;padding:4px 8px}.sectionhead{margin-bottom:12px}.muted{color:#999;font-size:12px}.pill{background:#f1f1f0;border-radius:5px;padding:3px 6px;font-size:11px;color:#666}.source-row{border:1px solid #ececec;margin-bottom:8px;padding:14px}.source-actions{display:flex;gap:8px}.prototype{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;background:#242424;color:white;padding:7px 10px;border-radius:22px;box-shadow:0 3px 16px #0003;font-size:12px}.prototype button{background:transparent;color:white;border:0;font-size:17px}.prototype .state{color:#bbb}.variant-b .tabs{border:0;background:#f1f1f0;padding:4px;border-radius:8px;width:max-content;gap:2px}.variant-b .tab{padding:7px 20px;border-radius:6px}.variant-b .tab.active{background:white;box-shadow:0 1px 3px #0002}.variant-b .tab.active:after{display:none}.variant-b .row{border-bottom:1px solid #eee;border-radius:0;padding:16px 2px}.variant-c .content{max-width:960px}.variant-c .workspace{display:flex;gap:32px}.variant-c .tabs{display:block;flex:none;width:160px;border:0;margin:0}.variant-c .tab{display:block;width:100%;text-align:left;padding:10px;border-radius:6px}.variant-c .tab.active{background:#efefee}.variant-c .tab.active:after{display:none}.variant-c .panel{flex:1;min-width:0}.empty{padding:30px;color:#999;text-align:center}@media(max-width:700px){.sidebar{width:170px}.content{margin-top:35px}.variant-c .workspace{display:block}.variant-c .tabs{display:flex;width:auto}.toolbar input{width:130px}}
</style>
</head>
<body><div id="app"></div>
<script>
// Throwaway prototype: compare three Marketplace layouts. Data and mutations are local-only.
const variants=['A','B','C'];const names={A:'Underline tabs',B:'Segmented tabs',C:'Section navigation'};
let variant='B';
let page='marketplace', tab='plugins', search='', source='', installed=new Set(['superpowers']);
let sources=['claude-plugins-official','superpowers-marketplace','team-plugins'];
const plugins=[{name:'frontend-design',desc:'Create distinctive, production-grade frontend interfaces with high design quality.',source:'claude-plugins-official',count:'1,266,133'},{name:'superpowers',desc:'Brainstorming, subagent driven development, code review and systematic debugging.',source:'superpowers-marketplace',count:'1,123,984'},{name:'code-review',desc:'Automated code review using multiple specialized agents.',source:'claude-plugins-official',count:'477,558'},{name:'skill-creator',desc:'Create new skills, improve existing skills, and measure skill performance.',source:'claude-plugins-official',count:'428,976'},{name:'team-workflow',desc:'Shared workflows for the team.',source:'team-plugins',count:''}];
const escapeHTML=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function nav(label,icon,key){return `<div class="nav ${page===key?'active':''}" data-page="${key}"><span>${icon}</span>${label}</div>`}
function tabButton(key,label){return `<button class="tab ${tab===key?'active':''}" data-tab="${key}">${label}</button>`}
function catalog(){const rows=plugins.filter(p=>(!source||p.source===source)&&`${p.name} ${p.desc} ${p.source}`.toLowerCase().includes(search.toLowerCase()));return `<div class="toolbar"><select id="source"><option value="">All sources</option>${sources.map(s=>`<option ${s===source?'selected':''}>${escapeHTML(s)}</option>`).join('')}</select><input id="search" placeholder="Search plugins..." value="${escapeHTML(search)}"></div>${rows.length?rows.map(p=>`<div class="row"><div class="rowbody"><div class="name">${p.name}</div><div class="description">${p.desc}</div><div class="meta">${p.source}${p.count?' &nbsp; | &nbsp; ⇩ '+p.count:''}</div></div><button class="iconbutton" data-plugin="${p.name}" title="${installed.has(p.name)?'Uninstall':'Install'}">${installed.has(p.name)?'⋮':'+'}</button></div>`).join(''):'<div class="empty">No plugins found</div>'}`}
function markets(){return `<div class="sectionhead"><h2>Registered <span class="muted">${sources.length} items</span></h2><div class="source-actions"><button class="action" id="refresh">Refresh all</button><button class="action primary" id="add">Add</button></div></div>${sources.map(s=>`<div class="row source-row"><div class="rowbody"><div class="name">${escapeHTML(s)}</div><div class="meta">git · ${escapeHTML(s)}</div></div><button class="iconbutton" data-remove="${escapeHTML(s)}" title="Remove sample source">⋯</button></div>`).join('')}`}
function render(){document.title='Marketplace prototype — '+variant;document.getElementById('app').innerHTML=`<div class="window variant-${variant}"><aside class="sidebar"><div class="traffic"><i></i><i></i><i></i></div><div class="back">← &nbsp; Back to app</div><div class="group">Settings</div><div class="nav"><span>☷</span>General</div><div class="nav"><span>▥</span>Models</div><div class="nav"><span>◉</span>Appearance</div><div class="nav"><span>⌨</span>Keyboard shortcuts</div><div class="nav"><span>▣</span>Projects</div><div class="group">Agent capabilities</div>${nav('Marketplace','◇','marketplace')}${nav('Plugins','♧','installed')}<div class="nav"><span>♙</span>Subagents</div><div class="nav"><span>▤</span>MCP</div><div class="nav"><span>✧</span>Skills</div></aside><main class="main"><div class="top">${page==='marketplace'?'Marketplace':'Plugins'}</div><div class="content">${page==='marketplace'?`<div class="market-header"><div class="market-tabs">${tabButton('plugins','Plugins')}${tabButton('marketplaces','Marketplaces')}</div></div><div class="panel">${tab==='plugins'?catalog():markets()}</div>`:`<div class="titlebar"><div><h1>Plugins</h1><p class="subtitle">Manage installed plugins.</p></div><button class="action primary" id="open-market" title="Open Marketplace">＋ &nbsp; Marketplace</button></div><div class="sectionhead"><h2>Installed <span class="muted">${installed.size} items</span></h2></div>${plugins.filter(p=>installed.has(p.name)).map(p=>`<div class="row source-row"><div class="rowbody"><div class="name">${p.name}</div><div class="meta">${p.source}</div></div><span class="pill">Enabled</span> ›</div>`).join('')}`}</div></main></div><div class="prototype"><strong>Prototype</strong><span class="state">${page==='marketplace'?tab:'installed plugins'}</span></div>`;
 document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=el.dataset.page;if(page==='marketplace')tab='plugins';render()});document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});document.querySelectorAll('[data-plugin]').forEach(el=>el.onclick=()=>{const n=el.dataset.plugin;installed.has(n)?installed.delete(n):installed.add(n);render()});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{if(confirm('Remove this sample source?')){sources=sources.filter(s=>s!==el.dataset.remove);if(source===el.dataset.remove)source='';render()}});const s=document.getElementById('source');if(s)s.onchange=()=>{source=s.value;render()};const q=document.getElementById('search');if(q)q.oninput=()=>{search=q.value;const pos=q.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)};const open=document.getElementById('open-market');if(open)open.onclick=()=>{page='marketplace';tab='plugins';render()};const add=document.getElementById('add');if(add)add.onclick=()=>{const n=prompt('Sample marketplace name');if(n&&n.trim()&&!sources.includes(n.trim())){sources.push(n.trim());render()}};const refresh=document.getElementById('refresh');if(refresh)refresh.onclick=()=>alert('Sample data refreshed (prototype only).');}
function cycle(n){variant=variants[(variants.indexOf(variant)+n+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
render();
</script></body></html>
