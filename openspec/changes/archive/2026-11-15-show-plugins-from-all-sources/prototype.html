<!doctype html><html lang="en"><meta charset="utf-8"><title>Marketplace filter prototype</title><style>body{font:16px system-ui;max-width:720px;margin:48px auto;padding:0 20px;color:#222}select,input,button{font:inherit;padding:8px}section{margin:24px 0;padding:18px;background:#f3f3f6;border-radius:8px}li{margin:8px 0}</style><h1>Marketplace filter prototype</h1><p>Can the same plugin be found in each marketplace including in the combined list?</p><section><label>Marketplace <select id="source"><option value="">All</option><option>claude-plugins-official</option><option>anthropic-plugin-directory</option></select></label> <label>Search <input id="query" value="frontend-de"></label><p id="state"></p><ul id="results"></ul></section><h2>Walkthroughs</h2><p>Choose each source to see its copy. Return to All to see both results.</p><button id="all">All</button> <button id="directory">Directory</button> <button id="official">Official</button><script>
const catalog=[{name:'frontend-design',source:'claude-plugins-official'},{name:'frontend-design',source:'anthropic-plugin-directory'}];
function visible(source,query){const chosen=source?catalog.filter(e=>e.source===source):catalog;return chosen.filter(e=>e.name.includes(query));}
const source=document.querySelector('#source'),query=document.querySelector('#query');function render(){document.querySelector('#state').textContent=`Source: ${source.value||'All'}; search: ${query.value}`;document.querySelector('#results').replaceChildren(...visible(source.value,query.value).map(e=>{const li=document.createElement('li');li.textContent=`${e.name} — ${e.source}`;return li}))}source.onchange=query.oninput=render;document.querySelector('#all').onclick=()=>{source.value='';render()};document.querySelector('#directory').onclick=()=>{source.value='anthropic-plugin-directory';render()};document.querySelector('#official').onclick=()=>{source.value='claude-plugins-official';render()};render();
</script></html>
