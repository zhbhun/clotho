<!doctype html><html lang="zh"><meta charset="utf-8"><title>前缀匹配排序原型</title><style>body{font:16px system-ui;max-width:720px;margin:48px auto}input,button{font:inherit;padding:8px}li{padding:6px}</style><h1>前缀匹配排序原型</h1><p>当搜索 superpower 时，短名称是否会比超长名称先出现？同长度按安装量排序。</p><label>搜索 <input id="q" value="superpower"></label> <button id="clear">清空搜索</button><p id="state"></p><ol id="result"></ol><h2>试一试</h2><button data-q="superpower">短名称优先</button> <button data-q="superpowers">完整匹配</button> <button data-q="">原始排序</button><script>
const entries=[{name:'superpowers',source:'官方',count:1123984},{name:'superpower-builder',source:'目录',count:9000},{name:'superpowers',source:'目录'}];
function ordered(entries,text){const q=text.trim().toLowerCase();const rank=e=>{const n=e.name.toLowerCase();return !q?0:n===q?0:n.startsWith(q)?1:n.includes(q)?2:3};return entries.filter(e=>!q||e.name.toLowerCase().includes(q)).sort((a,b)=>rank(a)-rank(b)||(q&&rank(a)===1?a.name.length-b.name.length:0)||(b.count??-1)-(a.count??-1)||a.name.localeCompare(b.name))}
const q=document.querySelector('#q');function render(){document.querySelector('#state').textContent=`搜索：${q.value||'（无）'}`;document.querySelector('#result').replaceChildren(...ordered(entries,q.value).map(e=>{const li=document.createElement('li');li.textContent=`${e.name} — ${e.source} — ${e.count??'安装量未知'}`;return li}))}q.oninput=render;document.querySelector('#clear').onclick=()=>{q.value='';render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;render()});render();
</script></html>
