<!doctype html><html lang="en"><meta charset="utf-8"><title>Directory source prototype</title><style>body{font:16px system-ui;max-width:720px;margin:48px auto;color:#222}section{border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}.sub{color:#777;margin-top:8px}button{padding:8px 14px}</style><h1>Directory marketplace source</h1><p>Prototype: can the existing source line show the directory path consistently in the list and detail?</p><section><b>zhbhun</b><div class="sub" id="line"></div></section><section><b>Info</b><p>Type: directory</p><p id="source"></p></section><button id="toggle">Toggle path availability</button><script>let path='/Users/example/trading';function render(){document.querySelector('#line').textContent=['directory',path].filter(Boolean).join(' · ');document.querySelector('#source').textContent='Source: '+(path||'directory')}document.querySelector('#toggle').onclick=()=>{path=path?'':'/Users/example/trading';render()};render()</script></html>
