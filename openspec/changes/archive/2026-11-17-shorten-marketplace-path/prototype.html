<!doctype html><html lang="en"><meta charset="utf-8"><title>Path display prototype</title><style>body{font:16px system-ui;max-width:700px;margin:48px auto}section{border:1px solid #ddd;border-radius:10px;padding:20px;color:#666}input{width:100%;padding:8px}</style><h1>Marketplace path display</h1><p>Prototype: how does a directory source look when its macOS home prefix is shortened?</p><input id="path" value="/Users/example/Projects/trading"><section id="result"></section><script>const p=document.querySelector('#path'),r=document.querySelector('#result');function render(){r.textContent='directory · '+p.value.replace(/^\/Users\/[^/]+/,'~')}p.oninput=render;render()</script></html>
