<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace breadcrumb prototype</title><style>body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#f4f4f4;margin:0}.app{max-width:850px;background:white;margin:32px auto;border:1px solid #e4e4e4;border-radius:12px;overflow:hidden}.head{padding:16px 24px;border-bottom:1px solid #eee;color:#858585}.head button{font:inherit;color:#777;background:none;border:0;padding:0;cursor:pointer}.body{padding:34px 24px;min-height:180px}.body h1{font-size:22px;margin:0 0 14px}.body p{color:#777}.controls{border-top:1px solid #eee;padding:20px 24px}.controls button{font:inherit;border:1px solid #ddd;background:#fff;border-radius:7px;padding:8px 12px;margin:4px;cursor:pointer}.state{margin:14px 4px;color:#666;font-size:13px}</style></head><body><div class="app"><div class="head" id="crumb"></div><div class="body"><h1 id="title"></h1><p>Prototype · Check the breadcrumb label and where it returns.</p></div><div class="controls"><div><button data-open="plugin">Open plugin detail</button><button data-open="market">Open marketplace detail</button><button data-open="add">Open add marketplace</button></div><div class="state" id="state"></div></div></div><script>
function openPage(kind){if(kind==='plugin')return {root:'Plugins',leaf:'frontend-design',tab:'Plugins'};if(kind==='market')return {root:'Marketplaces',leaf:'claude-plugins-official',tab:'Marketplaces'};return {root:'Marketplace',leaf:'Add marketplace',tab:'Marketplaces'}}
let state=openPage('plugin');function render(){const c=document.querySelector('#crumb');c.replaceChildren();const root=document.createElement('button');root.textContent=state.root;root.onclick=()=>{state={...state,leaf:'',returned:true};render()};c.append(root);if(state.leaf)c.append(document.createTextNode('  ›  '+state.leaf));document.querySelector('#title').textContent=state.returned?state.tab+' list':state.leaf;document.querySelector('#state').textContent=state.returned?'Returned to: '+state.tab:'Return destination: '+state.tab}document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state=openPage(b.dataset.open);render()});render()
</script></body></html>
