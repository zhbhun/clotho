<!doctype html><html lang="zh"><meta charset="utf-8"><title>插件搜索排序原型</title><style>body{font:16px system-ui;max-width:740px;margin:48px auto;padding:0 20px}input,button{font:inherit;padding:8px}li{padding:8px}small{color:#666}section{background:#f4f4f6;padding:20px;border-radius:8px}</style><h1>插件搜索排序原型</h1><p>搜索时，完整名称匹配的不同市场是否能一起排在其他结果前面？同一匹配程度按安装量排序。</p><label>搜索 <input id="query" value="superpowers"></label> <button id="reset">清空</button><section><p id="state"></p><ol id="list"></ol></section><h2>试一试</h2><button data-query="superpowers">完整名称</button> <button data-query="super">名称开头</button> <button data-query="powers">名称包含</button> <button data-query="">没有搜索词</button><script>
const catalog=[{name:'superpowers',source:'官方市场',count:1123984},{name:'superpowers',source:'Anthropic 目录'},{name:'superpowers-extra',source:'其他市场',count:200},{name:'my-superpowers',source:'其他市场',count:400},{name:'related-tool',source:'其他市场',description:'superpowers',count:5000}];
function ordered(entries,search){const q=search.trim().toLowerCase();const rank=e=>{const n=e.name.toLowerCase();return !q?0:n===q?0:n.startsWith(q)?1:n.includes(q)?2:3};return entries.filter(e=>!q||e.name.toLowerCase().includes(q)||(e.description||'').toLowerCase().includes(q)||e.source.toLowerCase().includes(q)).sort((a,b)=>rank(a)-rank(b)||(b.count??-1)-(a.count??-1)||a.name.localeCompare(b.name)||a.source.localeCompare(b.source))}
const input=document.querySelector('#query');function render(){document.querySelector('#state').textContent=`搜索：${input.value||'（无）'}`;document.querySelector('#list').replaceChildren(...ordered(catalog,input.value).map(e=>{let li=document.createElement('li');li.textContent=`${e.name} — ${e.source} — ${e.count??'安装量未知'}`;return li}))}input.oninput=render;document.querySelector('#reset').onclick=()=>{input.value='';render()};document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{input.value=b.dataset.query;render()});render();
</script></html>
