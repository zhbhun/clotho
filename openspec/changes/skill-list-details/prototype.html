const skills = [
 ['archify','绘制架构、工作流和数据流图，并导出为可交互的 HTML。','绘制架构图','确定系统边界、组件及其关系。选择适合的图形表达，检查连线方向与标签，再导出图表。',164],
 ['brainstorming','在动手实现前，一起探索想法，厘清目标和设计方向。','讨论设计','先了解用户希望解决的问题。结合项目现状，每次讨论一个会影响设计的决定，再用可点击的原型验证交互。',267],
 ['cheatsheet','把常用命令和操作整理成便于查阅的速查表。','整理速查表','按使用场景组织条目，给每个命令配一个可以直接理解的例子。',32],
 ['code-review','审查代码变更，识别影响正确性和项目约定的问题。','审查变更','阅读改动及其调用路径，对照用户要求确认行为。记录可以复现的问题，并标注对应位置。',215],
 ['diagnosing-bugs','复现问题、收集证据，并验证根因。','定位问题','记录稳定的复现步骤，缩小故障范围，再检查修复后的表现。',352],
 ['diagram-design','创建架构图、流程图、时序图和数据模型图。','设计图表','从要回答的问题出发确定图表类型，统一元素层级与标注。',137],
 ['humanizer','调整文字表达，让行文更自然，保留作者的原意。','润色文本','阅读上下文，保留事实和作者语气，让句子更直接易读。',45]

const details={"archify":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>archify\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>Create polished, validated architecture, workflow, sequence, data-flow, and lifecycle/state diagrams as explorable standalone HTML with inline SVG, dark/light themes, optional trace motion, and PNG/JPEG/WebP/SVG/WebM export. Accept plain-language requirements or pasted Mermaid flowchart, sequenceDiagram, and stateDiagram input; inspect repository evidence when the diagram must reflect real code. Use when the user asks to visualize system architecture, infrastructure, cloud/security/network topology, technical workflows, API call sequences, request lifecycles, data pipelines, ETL/ELT, data lineage, state machines, or to convert/beautify Mermaid. Also use for everyday subjects with steps, parts, relationships, or states: a leave or travel plan, an application or approval process, a back-and-forth such as renting, where money or documents go, or where an application or order stands. Not for numeric charts or dashboards.\u003c/dd>\u003cdt>license\u003c/dt>\u003cdd>MIT\u003c/dd>\u003cdt>version\u003c/dt>\u003cdd>3.0\u003c/dd>\u003cdt>author\u003c/dt>\u003cdd>tt-a1i\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003ch1>Archify\u003c/h1>\n\u003cp>Create an interactive HTML diagram from typed JSON. Static output is the default; enable motion only when requested.\u003c/p>\n\u003cp>Run commands from your working directory. Unless the user names another location, give each new diagram request its own folder \u003ccode>.archify/&lt;type&gt;-&lt;slug&gt;-&lt;YYYYMMDD-HHMMSS&gt;/\u003c/code> there (local time, chosen once when the request starts): keep \u003ccode>candidate.json\u003c/code> and \u003ccode>&lt;slug&gt;.html\u003c/code> in it, set \u003ccode>meta.output\u003c/code> to that relative HTML path, and reuse the folder for every repair rerun. A later request gets a new folder, so earlier versions stay intact. Replace \u003ccode>bin/archify.mjs\u003c/code> in the commands below with the installed package's absolute path, or its path relative to your working directory; input and output paths resolve from that working directory.\u003c/p>\n\u003cp>For a real codebase, read Repository authoring while tracing the requested behavior. A system description uses the steps below; an existing JSON uses the handoff path.\u003c/p>\n\u003ch2>Existing candidate handoff\u003c/h2>\n\u003cp>When the user supplies a frozen candidate, run \u003ccode>finalize\u003c/code> first as one CLI invocation. Its passing receipt completes the automated gates; follow any visual review recommendation under Delivery before claiming visual quality. For repair, follow step 5.\u003c/p>\n\u003cp>\u003ccode>finalize\u003c/code> includes a bounded update check in its delivery receipt; see Update awareness.\u003c/p>\n\u003ch2>Fast authoring path\u003c/h2>\n\u003cp>Use this path for ordinary generation. Read branch references only when their stated trigger applies.\u003c/p>\n\u003col>\n\u003cli>\u003cp>Choose \u003ccode>architecture\u003c/code>, \u003ccode>workflow\u003c/code>, \u003ccode>sequence\u003c/code>, \u003ccode>dataflow\u003c/code>, or \u003ccode>lifecycle\u003c/code> from the question.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Use the exact schema and example paths in the Type router without listing their directories. Read Authoring defaults and the mode's example in a bounded batch separate from project documents and complete schemas so neither is truncated; recover any missing section before writing. For Architecture, use the matching showcase example. For Sequence, Dataflow, and Lifecycle, also read the mode and common schemas. Read the relevant schema definition before choosing any new field, enum, or constrained text, especially boundary kinds. Examples teach shape, not facts. Use fresh IDs, wording, and layout. Go directly to the candidate without preliminary help, doctor, starter validation, temporary diagrams, or output-path listing. Query brands only for an explicitly requested mark; read Brand marks for an unknown mark with a user-provided URL.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Once the requested scope and, for a real codebase, source evidence are covered, write the complete candidate directly without planning coordinates in prose. Choose Architecture abstraction and connected placement using Authoring defaults before coordinates: show the main user journey and necessary branches, preserve control roles and behavior-changing conditions, and leave enough room for actual relationship labels. No node, relationship, source, view, card, or boundary count is a target or ceiling. Use automatic routes first; add explicit routing only for necessary branch, return, supplied geometry, or measured repair. Set \u003ccode>meta.quality_profile\u003c/code> to \u003ccode>\"showcase\"\u003c/code> unless the user requests dense \u003ccode>standard\u003c/code>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Once the complete first candidate is written, run \u003ccode>finalize\u003c/code> directly. Its first gate is showcase validation; successful first drafts need no separate pre-validation. Keep the candidate unchanged while the command runs:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">node bin/archify.mjs finalize &lt;type&gt; &lt;candidate.json&gt; &lt;output.html&gt; --quality showcase --json\n\u003c/code>\u003c/pre>\n\u003cp>For a repository-backed candidate, include evidence on the first draft and use the complete first command: \u003ccode>node bin/archify.mjs finalize &lt;type&gt; &lt;candidate.json&gt; &lt;output.html&gt; --repo-root &lt;repo-root&gt; --quality showcase --json\u003c/code>.\u003c/p>\n\u003cp>A passing receipt proves the included \u003ccode>validate\u003c/code>, \u003ccode>deliver\u003c/code>, strict \u003ccode>check\u003c/code>, and real-browser \u003ccode>browser-check\u003c/code> gates passed. Use its compact summary; run standalone commands only for a separate request or focused failure diagnosis.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>A non-zero exit is never success. Read compact stdout or \u003ccode>evidence.summaryReceipt\u003c/code>, then repair the failed gate, including its repair limit. Preserve requested meaning and source evidence. For several tangled Architecture routes, read Architecture layout repair; for measured field or geometry failures, read Authoring contract. Edit the connected neighborhood and rerun the complete \u003ccode>finalize\u003c/code> command from step 4.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch2>Update awareness\u003c/h2>\n\u003cp>\u003ccode>finalize\u003c/code> and standalone \u003ccode>deliver\u003c/code> include \u003ccode>update\u003c/code> in their receipts. Do not run a separate check for the same delivery. If \u003ccode>update.noticeRequired\u003c/code> is true, read \u003ccode>references/update-awareness.md\u003c/code> and keep one update line in your final response to the user, even after a quality gate fails. For a task with several diagrams, mention the update once in the final response. Snooze or ignore a reminder only when the user explicitly asks; never install or update on your own initiative.\u003c/p>\n\u003cp>Before the first candidate, use the authoring references and relevant repository source, not Archify implementation or tests. Inspect Archify implementation if diagnostics remain unactionable after focused repairs.\u003c/p>\n\u003ch2>Type router\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Type\u003c/th>\n\u003cth>Use for\u003c/th>\n\u003cth>Schema\u003c/th>\n\u003cth>Example\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>architecture\u003c/code>\u003c/td>\n\u003ctd>Components, services, cloud/security boundaries, infrastructure; what something everyday is made of\u003c/td>\n\u003ctd>\u003ccode>schemas/architecture.schema.json\u003c/code>\u003c/td>\n\u003ctd>System descriptions, services, libraries, and CLI repos: \u003ccode>examples/web-app.architecture.json\u003c/code>; deployment repos: \u003ccode>examples/production-deployment.architecture.json\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>workflow\u003c/code>\u003c/td>\n\u003ctd>Processes, approval gates, tool calls, runbooks, CI/CD; plans and step-by-step life processes\u003c/td>\n\u003ctd>\u003ccode>schemas/workflow.schema.json\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>examples/agent-tool-call.workflow.json\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sequence\u003c/code>\u003c/td>\n\u003ctd>API call chains, request lifecycles, async traces, returns; back-and-forth between people\u003c/td>\n\u003ctd>\u003ccode>schemas/sequence.schema.json\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>examples/cache-miss-request.sequence.json\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>dataflow\u003c/code>\u003c/td>\n\u003ctd>Pipelines, ETL/ELT, lineage, governance, consumers; where money or documents go\u003c/td>\n\u003ctd>\u003ccode>schemas/dataflow.schema.json\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>examples/product-analytics.dataflow.json\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>lifecycle\u003c/code>\u003c/td>\n\u003ctd>State/status transitions, retries, waiting and terminal states; where an application or order stands\u003c/td>\n\u003ctd>\u003ccode>schemas/lifecycle.schema.json\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>examples/deployment-release.lifecycle.json\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>When ambiguous, run \u003ccode>node bin/archify.mjs guide \"&lt;scenario&gt;\" --json\u003c/code>. Scenario proof examples are structural references, not facts to copy.\u003c/p>\n\u003cp>For an everyday subject, keep the same five modes and semantic types, then name them for the reader: use everyday \u003ccode>icon\u003c/code> values and \u003ccode>meta.legend\u003c/code> labels as in Node icons. Ask for missing personal facts instead of inventing dates, amounts, or rules.\u003c/p>\n\u003ch2>Mermaid input\u003c/h2>\n\u003cp>Read Mermaid for topology and meaning, then author fresh Archify JSON; do not mechanically render Mermaid styling.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>flowchart\u003c/code> / \u003ccode>graph\u003c/code> → \u003ccode>workflow\u003c/code>, or \u003ccode>architecture\u003c/code> for a component map.\u003c/li>\n\u003cli>\u003ccode>sequenceDiagram\u003c/code> → \u003ccode>sequence\u003c/code>; participants become semantic participants and arrows become messages.\u003c/li>\n\u003cli>\u003ccode>stateDiagram\u003c/code> → \u003ccode>lifecycle\u003c/code>; states and transitions retain meaning, not Mermaid style.\u003c/li>\n\u003c/ul>\n\u003ch2>Delivery\u003c/h2>\n\u003cp>Use the \u003ccode>finalize\u003c/code> command above for the first candidate and after a repair.\u003c/p>\n\u003cp>\u003ccode>finalize\u003c/code> stops at the first non-passing gate. Its compact stdout and \u003ccode>&lt;output-stem&gt;.finalize-summary.json\u003c/code> are ordinary evidence. A passing run creates no screenshots and reports \u003ccode>visualReview: \"not-requested\"\u003c/code>.\u003c/p>\n\u003cp>When a passing Architecture receipt reports \u003ccode>visualReviewRecommendation.signals.resolvedCrossovers\u003c/code>, copy the candidate aside and apply the hints in one edit that changes only node positions and sizes: every node, relationship (including its \u003ccode>from\u003c/code> and \u003ccode>to\u003c/code>), label, and source stays as it was. Rerun the complete \u003ccode>finalize\u003c/code> once with \u003ccode>--out-dir &lt;folder&gt;/review-2\u003c/code>, because the previous HTML already owns its browser evidence. If that run fails or reports more crossings, restore the copy and finalize it with \u003ccode>--out-dir &lt;folder&gt;/review-3\u003c/code>. Do not start a second placement round. Hints about extra bends alone are optional.\u003c/p>\n\u003cp>When \u003ccode>layoutReviewRecommendation.action\u003c/code> is \u003ccode>inspect-sequence-width\u003c/code>, follow Sequence width review before handing off a newly authored Sequence.\u003c/p>\n\u003cp>Perceptual review is optional for ordinary generation, including a newly positioned Architecture. Use Optional capture evidence, with \u003ccode>--out-dir &lt;folder&gt;/visual-check\u003c/code>, when the user requests visual review, during development audits, or for a concrete route/browser concern. \u003ccode>visualReviewRecommendation\u003c/code> is advisory. Inspect captures before claiming visual quality; otherwise report automated checks only.\u003c/p>\n\u003cp>Read Delivery contract for failed gates, standalone commands, provenance/recovery, repeated delivery, exports, or opening. Recovery follows \u003ccode>deliver\u003c/code> → strict provenance \u003ccode>check\u003c/code> → \u003ccode>browser-check\u003c/code>; captures require strict provenance.\u003c/p>\n\u003cp>For workflow viewport overflow, read Workflow viewport repair before the next layout edit.\u003c/p>\n\u003cp>Report artifact checks, browser evidence, captures, and actual perceptual review as distinct results. For an explicitly requested immediate preview or active desktop loop, see Optional opening.\u003c/p>\n\u003ch2>Optional viewer capabilities\u003c/h2>\n\u003cp>\u003ccode>meta.animation: \"trace\"\u003c/code> is opt-in.\u003c/p>\n\u003cp>Read \u003ccode>references/viewer-runtime.md\u003c/code> only when the user explicitly asks for Share Cards, Route/Reach cards, motion, deep links, presentation, search/focus, or another Viewer Runtime feature.\u003c/p>\n\u003ch2>Setup and fallback\u003c/h2>\n\u003cp>No install is required inside the skill package. For setup diagnosis, verify with:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">node bin/archify.mjs doctor\nnode bin/archify.mjs demo &lt;output-directory&gt;\n\u003c/code>\u003c/pre>\n\u003cp>When shell access is unavailable, hand-place architecture SVG into \u003ccode>assets/template.html\u003c/code>, use CSS semantic classes rather than inline colors, and follow the visual review contract in \u003ccode>references/delivery-contract.md\u003c/code>.\u003c/p>\n\u003ch2>Output\u003c/h2>\n\u003cp>Return the checked HTML as an absolute path, diagram type, validation summary, specification/artifact receipt, browser-evidence status, and truthful visual-review status. Do not claim success for a non-zero command or claim visual inspection you did not perform.\u003c/p>\n\u003c/article>","brainstorming":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>brainstorming\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>Use when the user asks to brainstorm, explore an idea, or discuss an unsettled design or direction, in software or outside it.\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003ch1>Brainstorming\u003c/h1>\n\u003cp>You are very good at building. You build what you believe your human\npartner wants, and that belief is usually thinner than it feels. This\nskill is for finding out what they actually want, and why, before\nanything gets built.\u003c/p>\n\u003cp>People often haven't finished working out what they want. Good questions\nhelp them think it through. When you understand the why, you make the\nhundred decisions they never mention the way they would have made them.\u003c/p>\n\u003ch2>First: What Do You Actually Know?\u003c/h2>\n\u003cp>Before you reply, ask yourself: what do I know about what they want, and\nwhy?\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Everything that matters is in the request\u003c/strong> (\"make the icon cornflower\nblue\"). For an explicit brainstorming request, summarize the direction;\notherwise, this is a quick, clear task. Do it, and say what you did.\u003c/li>\n\u003cli>\u003cstrong>Something non-trivial is missing.\u003c/strong> Start the conversation.\u003c/li>\n\u003c/ul>\n\u003cp>Lay out the approaches in a message of their own, and have your human\npartner pick one (see Lay out the approaches). If nothing is open when\nyou write your first message and there's one sensible way, present that\ndirection in the first message (see Your First Message).\u003c/p>\n\u003cp>Brainstorming ends with a summary in the conversation. Do not create a\nspec or plan, invoke another skill, or start implementation merely because\nbrainstorming is complete. Follow any separate request from your human\npartner for further work.\u003c/p>\n\u003cp>When brainstorming is explicitly requested, treat the initial task as context\nfor the discussion, even if it also describes work to build. Answers to\nquestions, added requirements, and confirmation of the design refine the\nproposal; they do not authorize implementation. Start implementation only\nwhen the user separately and explicitly asks to proceed, such as \"implement\nit\" or \"change the code\". If the reply is ambiguous, continue the discussion\nand clarify before making changes.\u003c/p>\n\u003ch2>Look Before You Ask\u003c/h2>\n\u003cp>In an existing project, or when they've given you context (a spec, a plan,\na handoff, files they pointed at, earlier conversation), dig in before your\nfirst message. Read what they referred to and the code or material it\nconnects to, and keep reading until you can explain how the relevant\nparts work today and what this change would touch. Never ask what the\nproject or their context already answers, or reopen what they've\nalready decided.\u003c/p>\n\u003ch2>Your First Message\u003c/h2>\n\u003cp>Move the work forward, with one of these:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>They've already said what they want\u003c/strong> (a spec, a plan, a detailed\nrequest): aim for about 200 words for the whole message. Echo their\nrequest back in your own words, so they can see whether you've got its\nshape: what they want, who it's for, and why, as far as they've said.\nAdd what you found that bears on it: how the relevant parts work today\nand what the change would touch. If you found something they may not\nhave considered that would change what they're asking for or how it\nhas to be built, like a constraint, a conflict, or a cheaper path, say\nso plainly. How to build it comes later, once you understand what they\nwant (see Lay out the approaches). End with one line inviting\ncorrections. Then, if they haven't told you why they want it, even if\nyou can guess, ask about that: one open question in their own terms,\nwith nothing to pick from. If they have told you, and their request\nand the project leave open something whose answer would change what\ngets built, ask about the one that would change it most; when its\nchoices can be named, sketch each concretely, with what it trades off\nand which you'd pick. If nothing like that is open, there's one\nsensible way: end with the short design itself (the approach, a line on\nwhy the others don't fit, and the design in a few lines) and ask them\nto confirm it. Their confirmation covers the approach and the design\nyou showed them, not the creation of a spec document.\u003c/li>\n\u003cli>\u003cstrong>They haven't:\u003c/strong> one open question, in their own terms, about the\nbiggest thing their request leaves unsettled. Say why you're asking:\nwhat the answer would change about what you build. For \"a website for\nmy bakery\": \"If it's mostly for people deciding whether to stop by,\nI'd lead with hours and what's in the case today; taking orders is a\ndifferent site. What do you want someone to do when they land on it?\"\u003c/li>\n\u003c/ul>\n\u003cp>How the message ends depends on whether their message asked for\nbrainstorming:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>They asked for it\u003c/strong> (by name, by invoking it, or by asking for a\ndesign discussion): end there. They want this conversation.\u003c/li>\n\u003cli>\u003cstrong>They didn't:\u003c/strong> they may not want a conversation at all. End with a\nlight, one-line offer to just get going instead, like\n\"Or if you'd rather I just dive in, say so.\" If they take you up on\nit, this skill is done: state any significant how-it-gets-made choice\n(platform, language, medium) in one plain line, then do what they\nasked through the normal workflow.\u003c/li>\n\u003c/ul>\n\u003cp>That's the whole message.\u003c/p>\n\u003ch2>The Conversation\u003c/h2>\n\u003cp>Ask a question only when the answer would change what gets built and\nneither the request nor the project answers it. Otherwise, state your\ncall and your reason as a proposal they can correct, and move the work\nforward. Process steps are always your calls: looking further and how to\nshow something. Do them and say so.\nAsk one at a time. Use plain language, pitched just a little above where\nyour human partner is. Match their vocabulary; never use process jargon.\nYou never need to quote this skill to your human partner.\u003c/p>\n\u003cp>Be clear and concise. Lead with what matters. Avoid jargon. When you\nreport what you found, give them the most important findings and offer\nthe rest.\u003c/p>\n\u003cp>\u003cstrong>Get them describing.\u003c/strong> Until you know why they want it, ask open\nquestions, with no example answers attached. Their own words carry\nintent that your options can't. Once you know why, when a decision has\nchoices you can name, sketch each concretely, with what it trades off\nand which you'd pick. When they say \"just guess\" or \"what do you think?\",\npropose something concrete.\u003c/p>\n\u003cp>\u003cstrong>How it gets made.\u003c/strong> Every project rests on choices about medium, tools,\nmaterials, and resources: the platform, programming language, and\nlibraries for an app; the medium for a piece of art. Read from how they\ntalk which of those choices they want to make. Someone who raises the how\nor asks about trade-offs wants the options with your pick. Someone who\ntalks about outcomes is handing you the how: make those calls and state\neach in a line. When there's existing work, build on what it already\nuses. Any choice you make goes in the design as your call, never as\nsomething they agreed to.\u003c/p>\n\u003cp>\u003cstrong>Ground to cover.\u003c/strong> This is territory, not a script. Never read these\nout as questions:\u003c/p>\n\u003cul>\n\u003cli>what kind of thing this is, and what makes it special\u003c/li>\n\u003cli>why now, and what success looks like to them\u003c/li>\n\u003cli>goals, non-goals, and anti-goals (what would make this a failure even\nif it technically works)\u003c/li>\n\u003cli>prior art: what they've seen elsewhere, loved or hated\u003c/li>\n\u003cli>current state: what exists now, what they've tried\u003c/li>\n\u003cli>the details they care about\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Make every question specific\u003c/strong> to their project and what they've told\nyou. Ask Socratically, the way a sharp colleague would: build each\nquestion on their last answer or on something you found, so it helps\nthem think through a consequence or a case they may have missed\n(\"Voting closes before the meeting, and two members joined this month.\nDoes someone who joins mid-round get a vote?\"). When the reason isn't\nalready plain, say what you're hoping to learn or what the answer would\nchange. A proposal they can correct, plus your reason for it, often\nbeats a question.\u003c/p>\n\u003cp>\u003cstrong>Do recon.\u003c/strong> Once you have a bit of grounding and looking further\nwould help, go look: deeper into their codebase or project, their own\nfiles and data, or the web. Say what you looked for and what you found.\u003c/p>\n\u003cp>\u003cstrong>Lay out the approaches.\u003c/strong> Once you understand what they want, and\nbefore you write anything up, put the ways of building it in a message\nof its own. Come up with several real alternatives and drop the weak\nones, including any that work against why they want it and any the\nexisting work rules out. Sketch the two or three that remain concretely\nenough to picture, grounded in what the project actually does, with what\neach trades off. Recommend one and say why, then ask which way they want\nto go; if they've handed you the how, say you'll go with your pick\ninstead. When there's genuinely one sensible way, say so in that\nmessage and explain why the others don't fit; the design comes in the\nnext one. This is for how it gets built; for what they want, get them\ndescribing first.\u003c/p>\n\u003cp>\u003cstrong>Show, don't tell.\u003c/strong> Whenever seeing would help more than reading,\nsketch it in text: a few lines of what they'd see. Offer the visual\ncompanion (below) when the look itself is theirs to decide:\u003c/p>\n\u003cul>\n\u003cli>something they'll look at: a screen, a page, a printout, a sign\u003c/li>\n\u003cli>a layout or arrangement: of a screen, a room, a schedule\u003c/li>\n\u003cli>a flow or a sequence of steps\u003c/li>\n\u003cli>options that would look different from each other\u003c/li>\n\u003cli>a structure that's easier to see than read: a diagram, a timeline, a map\u003c/li>\n\u003c/ul>\n\u003cp>Once they've accepted, use it for mockups to react to, side-by-side\noptions, and throwaway prototypes they can click.\u003c/p>\n\u003cp>\u003cstrong>Spike to feel things out.\u003c/strong> Agentic work is waterfall, but very, very\nfast. A quick throwaway build is often the cheapest way to learn what\nthey want or whether something works. Offer one when it would help.\nWhen they just want to spike, get out of the way. Spikes get no tests\nor minimal ones and aren't bulletproof. Bring what the spike taught you\nback into the conversation.\u003c/p>\n\u003ch2>Play It Back\u003c/h2>\n\u003cp>Play back as you go. As soon as you understand one part well enough to\ndescribe it (what it's for and who it serves, say, or how one piece\nbehaves), describe that part back in about 200-300 words, then return to\nquestions about the next part. Playback and questions alternate through\nthe whole conversation; the last chunk covers whatever is left.\u003c/p>\n\u003cp>Only what they said goes in as theirs. Anything you filled in goes in\nas your proposal, with your reason. End each chunk by asking what's wrong\nor missing.\u003c/p>\n\u003cp>Before you send a chunk, check it: does it describe something they'll\nlook at, like a page, a screen, a schedule, or a printout? If so, put a\ntext sketch next to the description. If the look itself is theirs to\ndecide and they haven't seen the visual companion offer yet, send the\noffer instead (its own message, below) and hold the chunk for the next\nmessage. Once they've accepted, put a mockup next to the description.\u003c/p>\n\u003ch2>Finish the Conversation\u003c/h2>\n\u003cp>If this is really several independent projects, say so, agree on an\norder, and brainstorm them one at a time.\u003c/p>\n\u003cp>Summarize the intent, goals, constraints, approaches and their tradeoffs,\nthe chosen direction, and any open questions in the conversation. Keep\nyour own proposals distinct from decisions your human partner made.\u003c/p>\n\u003ch2>Red Flags\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Thought\u003c/th>\n\u003cth>Reality\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\"I'll offer a menu of what they might want\"\u003c/td>\n\u003ctd>Options steer. Ask them to describe it first.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\"I'll fill in sensible defaults\"\u003c/td>\n\u003ctd>Good. Say them out loud. A default they never heard is one they couldn't reject.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\"I should explain the process first\"\u003c/td>\n\u003ctd>Ask your question. The process shows itself.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\"The spike works, I'll keep building on it\"\u003c/td>\n\u003ctd>Keeping it is a new request.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Visual Companion\u003c/h2>\n\u003cp>A browser tab for showing mockups, diagrams, and prototypes. It's a\ntool, not a mode: accepting it doesn't send every question to the\nbrowser.\u003c/p>\n\u003cp>\u003cstrong>Offer it just-in-time.\u003c/strong> Offer it the first time one of the moments\nabove comes up, never upfront. The offer is its own message with nothing\nelse in it:\u003c/p>\n\u003cblockquote>\n\u003cp>\"This might be easier if I show you. Want me to open a browser tab with some mockups?\"\u003c/p>\n\u003c/blockquote>\n\u003cp>If they decline, stay in text and don't offer again unless they raise it.\u003c/p>\n\u003cp>\u003cstrong>Per question, ask: would they understand this better by seeing it?\u003c/strong>\nMockups, layouts, diagrams, and side-by-side designs go in the browser.\nRequirements, scope, tradeoffs, and conceptual choices stay in text. A\nquestion about a UI topic isn't automatically a visual question.\u003c/p>\n\u003cp>If they accept, read \u003ccode>visual-companion.md\u003c/code> in this directory before\nstarting the server.\u003c/p>\n\u003ch2>To Spec\u003c/h2>\n\u003cp>After the final brainstorming summary, if they have neither explicitly\nrequested nor declined a document, end the response with one sentence asking\nwhether they would like a spec document written. Ask in the response itself,\nnot through an agent question or user-input tool. Once they explicitly\nrequest or agree to the document, read \u003ccode>spec.md\u003c/code> in this directory and follow\nit. Agreement with the design alone is not consent to write a document;\nclarify ambiguous replies before writing. If they decline, do not ask again\nunless they bring it up.\u003c/p>\n\u003c/article>","cheatsheet":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>cheatsheet\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>仅当用户显式引用 cheatsheet 或明确点名 cheatsheet 技能时使用；禁止根据学习意图自动调用。\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003cp>用户已经请求学习某个领域。你要围绕这个主题本身建立并推进一套\u003cstrong>完备的速查手册\u003c/strong>：收集可信资源，确认根目录 \u003ccode>ROADMAP.md\u003c/code> 中的学习路线，然后沿着路线准备课程。\u003c/p>\n\u003cp>手册同时服务两种用法：顺读时能理解概念并快速上手；回查时能立刻落到代码、默认值和故障判断。它不是只抄命令的纸条，也不是长篇讲义——概念要讲清，用法要直给。手册面向主题，不面向某个读者的当前水平：主题的能力地图决定路线和内容，提到主题的常见能力点时，手册里应有对应入口。\u003c/p>\n\u003cp>在创建课程之前，\u003ccode>NOTE.md\u003c/code> 中的约束、\u003ccode>RESOURCES.md\u003c/code> 中的资源清单和根目录 \u003ccode>ROADMAP.md\u003c/code> 中的学习路线必须已经建立、彼此一致且得到用户确认。\u003c/p>\n\u003ch2>执行边界\u003c/h2>\n\u003cp>本技能使用独立工作流。执行本技能时，只按本文件及其明确引用的格式规范完成规划、实现和相应阶段的复核；不要调用或套用 Superpowers 及其他通用软件开发过程技能，包括 brainstorming、writing plans、TDD、systematic debugging、code review 和 verification before completion，也不要让这些技能增加额外的确认、计划文件、子代理、测试或验收门禁。初始化工程、收集资料和制作范例等任务所需工具不受此限制。\u003c/p>\n\u003cp>课程阶段完成制作后，只按 \u003ccode>CHEATSHEET-FORMAT.md\u003c/code> 做内容复核，不执行静态检查、类型检查、构建、单元测试、集成测试或运行时验收，也不把这些作为课程交付门禁；初始化阶段的工程验证仍按下文执行。课程主题本身是测试时，测试代码只作为教学内容和范例。\u003c/p>\n\u003ch2>手册目标\u003c/h2>\n\u003cp>一套合格的速查手册满足：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>能力地图完整。\u003c/strong> 路线覆盖主题的核心概念、常见实践和进阶分支。\u003c/li>\n\u003cli>\u003cstrong>每节课自洽可查。\u003c/strong> 课程让读者理解当前节点并快速上手，也能作为日后回查入口；固定骨架与内容复核方式见 CHEATSHEET-FORMAT.md。\u003c/li>\n\u003cli>\u003cstrong>可以长期扩展。\u003c/strong> 路线按阶段从上手延伸到进阶主题；新增节点按同样规则插入路线和 \u003ccode>cheatsheets/\u003c/code>，不打乱已有结构。\u003c/li>\n\u003c/ul>\n\u003ch2>学习工作区\u003c/h2>\n\u003cp>把当前目录视为一个学习工作区。手册内容由这些文件支撑：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>NOTE.md\u003c/code>：已确认的约束、偏好和工作笔记，例如语言、工具链、示例风格和主题边界。不要在这里记录路线变化、当前课程或课程完善度；这些信息应从根目录 \u003ccode>ROADMAP.md\u003c/code> 与 \u003ccode>cheatsheets/\u003c/code> 中判断。使用 NOTE-FORMAT.md 中的格式。\u003c/li>\n\u003cli>\u003ccode>RESOURCES.md\u003c/code>：经过筛选和注释的资源清单，用来支撑学习路径。优先使用官方文档、一手资料、被认可的专家、书籍、论文，以及管理良好的社群。只收录属于本主题且自成体系的资源：官方地址直接列在开头，其余按社区、教程、示例、工具、资源分区。关联但属于其他主题或细分知识的资料，以及体系内部的子页面（具体 API 页、手册章节、教程小节），都不在这里罗列，用到时写进对应课程的 \u003ccode>## 参考资料\u003c/code>。使用 RESOURCES-FORMAT.md 中的格式。\u003c/li>\n\u003cli>\u003ccode>README.md\u003c/code>：由用户自行维护。技能不动 \u003ccode>README.md\u003c/code>：不创建、不修改、不约束内容，也不往里写手册内容或入口链接。\u003c/li>\n\u003cli>\u003ccode>ROADMAP.md\u003c/code>：包含已经确认的 Markdown 学习路线。它按阶段和按需主题组列出课程链接和一句话说明，使用 ROADMAP-FORMAT.md 中的格式。\u003c/li>\n\u003cli>\u003ccode>assets/*\u003c/code>：课程之间复用的资源，例如图表、数据集、模板、代码片段或媒体文件。\u003c/li>\n\u003cli>\u003ccode>package.json\u003c/code> 与 \u003ccode>.storybook/*\u003c/code>：所有课程共用的 Storybook 工作区、启动脚本和文档阅读器外壳；首次初始化使用 template/ 中的工程骨架。\u003c/li>\n\u003cli>\u003ccode>cheatsheets/&lt;cheat-sheet-name&gt;/README.mdx\u003c/code>：一节自洽的课程正文，也是统一的 Storybook Docs 入口。命名、固定骨架、Storybook 元数据和验收规则使用 CHEATSHEET-FORMAT.md。\u003c/li>\n\u003cli>\u003ccode>cheatsheets/&lt;cheat-sheet-name&gt;/&lt;example-project-files&gt;\u003c/code>：这节课对应的示例项目、范例文件或演示材料。\u003c/li>\n\u003c/ul>\n\u003ch2>工作流\u003c/h2>\n\u003ch3>先定位本次任务\u003c/h3>\n\u003cp>每次执行先结合用户当前请求检查工作区中的 \u003ccode>NOTE.md\u003c/code>、\u003ccode>RESOURCES.md\u003c/code>、\u003ccode>ROADMAP.md\u003c/code> 和相关课程，只进入这次真正需要的阶段：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用户意图或工作区状态\u003c/th>\n\u003cth>进入的阶段\u003c/th>\n\u003cth>主要产物\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>初始化 Storybook 学习工作区，或补齐、迁移现有工程基础设施\u003c/td>\n\u003ctd>初始化\u003c/td>\n\u003ctd>可安装、启动和构建的 Storybook 学习工作区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首次建立手册、确定主题，或修改边界、工具、环境、语言、范例偏好\u003c/td>\n\u003ctd>确定主题与约束\u003c/td>\n\u003ctd>\u003ccode>NOTE.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收集、筛选、补充或替换学习资源\u003c/td>\n\u003ctd>收集或更新资源\u003c/td>\n\u003ctd>\u003ccode>RESOURCES.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新建、补全、拆分或重排学习路线\u003c/td>\n\u003ctd>编写或调整学习路线\u003c/td>\n\u003ctd>\u003ccode>ROADMAP.md\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备指定课程，或继续下一节尚未完成的课程\u003c/td>\n\u003ctd>编写或更新课程\u003c/td>\n\u003ctd>\u003ccode>cheatsheets/&lt;cheat-sheet-name&gt;/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>按以下规则决定本次范围：\u003c/p>\n\u003cul>\n\u003cli>用户明确指定了阶段时，只执行该阶段，以及缺失或冲突并且会阻塞它的前置阶段。不要顺手重做已经满足的前置阶段，也不要自动进入用户没有要求的后续阶段。\u003c/li>\n\u003cli>初始化是独立的工程阶段。用户只要求初始化时，完成工程验证后停止；编写课程时发现 Storybook 工程基础缺失或冲突，先执行初始化阶段，完成后再返回课程阶段。\u003c/li>\n\u003cli>用户首次提出建立整套手册而未限定阶段时，可以按依赖顺序连续完成主题与约束、资源和路线；阶段之间没有阻塞性选择时不必停下来。开始课程仍须满足三份规划文件的确认门槛。\u003c/li>\n\u003cli>更新上游文件后检查下游文件是否仍然一致。没有冲突就保留原确认状态；发现冲突时说明受影响的文件和原因，只在用户请求包含该修改时继续更新，否则停在本次目标阶段。\u003c/li>\n\u003cli>同一轮新建或实质修改了多个规划文件时，可以一起展示并请求确认；只修改一个文件时，确认范围只包含该文件。不要把未受影响的文件重新纳入确认。\u003c/li>\n\u003cli>主题与约束、资源、路线是可独立执行的规划阶段，不是三个必须逐项停下的审批门。完成本次请求包含的规划阶段后，再确认本轮新建或实质修改的产物；确认只阻止课程创建，不阻止在信息充分时继续准备后续规划产物。\u003c/li>\n\u003c/ul>\n\u003cp>进入任何阶段前，先用用户请求、现有文件、相关格式规范和可信资料做一轮聚焦分析，找出会改变本阶段产物的未决选择。现有信息足够时直接推进，并在阶段结果中说明关键假设；信息不足时，只询问当前真正阻塞产物的问题，逐个解决后继续。\u003c/p>\n\u003ch3>初始化项目\u003c/h3>\n\u003cp>本阶段只负责把目标目录准备成可安装、启动和构建的 Storybook 学习工作区，不确定主题，不收集资源，不编写路线，也不创建或修改实际课程内容。用户只要求初始化时，不自动进入其他阶段。\u003c/p>\n\u003cp>开始前检查目标工作区以及已经存在的 \u003ccode>NOTE.md\u003c/code>。\u003ccode>NOTE.md\u003c/code> 已确认包管理器或 Storybook framework 时沿用该约束；没有对应约束时使用 npm 和模板默认的 \u003ccode>@storybook/html-vite\u003c/code>。\u003c/p>\n\u003cul>\n\u003cli>工作区还没有可复用的 Storybook 时，把完整的 template/ 复制为工程基础。模板根目录本身就是可以安装、启动和构建的 Storybook 项目。\u003c/li>\n\u003cli>工作区已经有 Storybook 时，沿用现有工程和包管理器，对照 \u003ccode>template/\u003c/code> 根目录逐项合并依赖、脚本和配置，补齐路线派生的 stories 输入、Docs addon、文档阅读器外壳、GFM、Mermaid、共享样式以及 \u003ccode>assets/\u003c/code> 中的通用能力；不用模板整体覆盖现有工程。\u003c/li>\n\u003cli>stories 输入按 \u003ccode>ROADMAP.md\u003c/code> 顺序生成：路线内且文件存在的课程纳入 \u003ccode>README.mdx\u003c/code> 和同级 \u003ccode>*.stories.*\u003c/code>，路线外课程不索引。\u003c/li>\n\u003cli>默认 npm 命令是 \u003ccode>npm install\u003c/code>、\u003ccode>npm run storybook\u003c/code>、\u003ccode>npm run typecheck\u003c/code> 和 \u003ccode>npm run build-storybook\u003c/code>；使用其他包管理器时执行同名脚本的对应命令。模板 \u003ccode>package.json\u003c/code> 中的 Storybook、Docs addon、framework 与 Vite 版本是一组配套版本，升级时一起更新。\u003c/li>\n\u003c/ul>\n\u003cp>完整模板中的 cheatsheets/sample-course/ 用于验证 Story、Canvas、Controls 和源码入口，是工程模板的一部分，不代表已经创建主题课程，也不触发资源、路线或课程阶段。具体课程需要的渲染器、场景构造、贴图或数据文件留在对应课程目录，不加入共享模板基础设施。\u003c/p>\n\u003ch4>文档阅读器外壳\u003c/h4>\n\u003cp>Storybook 集中承载课程，且 Story / Canvas 只作正文内嵌实例时，Manager 使用统一阅读器外壳：侧栏保留品牌、搜索和课程导航，每课只暴露 \u003ccode>&lt;cheat-sheet-name&gt;--docs\u003c/code>；同级 stories 只为内嵌 \u003ccode>Story\u003c/code> / \u003ccode>Canvas\u003c/code> 提供数据，不形成独立入口。集中配置须完成以下职责，实现以 \u003ccode>template/.storybook/\u003c/code> 为准：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>.storybook/main.*\u003c/code> 关闭 onboarding 和只服务独立组件工作台的调试功能。\u003c/li>\n\u003cli>\u003ccode>.storybook/manager.*\u003c/code> 全局隐藏 Manager 顶部工具栏。\u003c/li>\n\u003cli>\u003ccode>.storybook/manager-head.html\u003c/code> 隐藏侧栏标题区的 Settings / About Storybook 入口，保留移动端侧栏关闭按钮。\u003c/li>\n\u003cli>\u003ccode>.storybook/preview.*\u003c/code> 接入共享 Docs 样式和 Mermaid Docs container，并确保每个 Docs Canvas 的源码入口存在且初始收起。\u003c/li>\n\u003cli>带实例课程在 stories 元数据中使用 \u003ccode>tags: ['!dev']\u003c/code>，只由 attached MDX 引用；无实例课程不创建空 stories 文件。\u003c/li>\n\u003c/ol>\n\u003cp>运行开发服务和静态构建后，必须同时满足：\u003c/p>\n\u003cul>\n\u003cli>侧栏保留品牌、搜索和课程 Docs 导航，没有 \u003ccode>Get started\u003c/code>、Settings、About Storybook 或独立 Story 条目。\u003c/li>\n\u003cli>页面没有 Manager 顶部工具栏。\u003c/li>\n\u003cli>Docs 正文正常渲染；带实例课程的内嵌 \u003ccode>Story\u003c/code> / \u003ccode>Canvas\u003c/code> 正常显示和交互。\u003c/li>\n\u003cli>Storybook 静态构建通过。\u003c/li>\n\u003c/ul>\n\u003cp>必须实际观察一次阅读器外壳；配置文本或构建退出码不能替代界面验收。\u003c/p>\n\u003cp>\u003cstrong>反例：\u003c/strong> 命令行课程没有交互实例，只配置 MDX glob 并保留 Storybook 默认 Manager，导致读者仍看到 onboarding、组件调试工具和设置入口。\u003c/p>\n\u003cp>完成标准：依赖安装、类型检查和静态构建成功；模板 Docs 的 GFM、软换行和 Mermaid 可正常渲染，Mermaid 失败时页面显示可定位错误；示例 Story 实际使用共享 Canvas / readout / source helper，Controls、派生读数和 Show code 能正常工作。只报告实际执行过的检查；完成后停在本阶段，除非用户请求还包含其他阶段。\u003c/p>\n\u003ch3>确定主题与约束\u003c/h3>\n\u003cp>手册的目标是固定的：围绕主题本身写一套完备、可长期查阅的速查手册——概念讲清、用法直给、回查有落点；内容不随读者当前水平裁剪。主题很宽泛时，先和用户收敛出一个边界清楚、可以成册的主题，再动手写文件。\u003c/p>\n\u003cp>首次初始化时，完整读取 NOTE-FORMAT.md，围绕主题的能力地图、纳入与排除边界、工具和运行环境、范例媒介以及路线组织分析需求。更新现有约束时，以用户要求修改的事项为中心，只补查会让新旧约束冲突的信息，不重做整套初始化分析。这里的分析属于本技能内部的需求探索，不调用外部 brainstorming 技能。\u003c/p>\n\u003cp>默认约束如下。把用户已经明确的约束和不会改变手册形态的默认值写进 \u003ccode>NOTE.md\u003c/code>；默认值会改变主题边界、资源选择或路线结构时，先向用户核对，不能静默代替用户决定：\u003c/p>\n\u003cul>\n\u003cli>从 0 开始快速上手目标技术，同时建立系统性理解；路线从入门延伸到进阶分支，后续提到相关能力时，应能在手册中找到对应课程。\u003c/li>\n\u003cli>实战和理论结合；能写示例的知识点尽量提供覆盖关键变体的范例。\u003c/li>\n\u003cli>教程正文、标题、说明、示例界面文案和代码注释使用中文；路径、命令、包名、API 名称和代码标识符保留英文。可以接受英文资源，优先官方文档和一手资料。\u003c/li>\n\u003cli>时间节奏按长期、系统学习来设计；课程既支撑顺读上手，也支撑日后按标题、开场参考与快速上手（存在时）回查。课程正文骨架、开场表达与快速上手职责以 CHEATSHEET-FORMAT.md 为唯一真源。\u003c/li>\n\u003c/ul>\n\u003cp>只询问真正影响手册形态的问题：\u003c/p>\n\u003cul>\n\u003cli>主题边界：哪些相邻主题暂不纳入\u003c/li>\n\u003cli>工具、环境或语言约束：例如示例采用的框架、构建工具和运行环境\u003c/li>\n\u003cli>会改变资源选择或路线设计的其他偏好\u003c/li>\n\u003c/ul>\n\u003cp>确认下来的约束和偏好写进 \u003ccode>NOTE.md\u003c/code>，后续会话直接沿用。\u003c/p>\n\u003cp>完成标准：主题边界和当前生效的约束已经明确；本次新引入且会改变手册形态的选择已经在写入前核对，确认后的结果记录到 \u003ccode>NOTE.md\u003c/code>。不要把未确认的选择写成生效约束，也不要只根据一个模糊领域名继续推进。\u003c/p>\n\u003ch3>收集或更新资源\u003c/h3>\n\u003cp>进入本阶段时完整读取 RESOURCES-FORMAT.md，沿用 \u003ccode>NOTE.md\u003c/code> 中已经生效的主题与约束；只有这些信息缺失或与资源目标冲突时，才返回前一阶段补齐。用 \u003ccode>RESOURCES.md\u003c/code> 标注每个来源覆盖什么内容、何时使用它。收集时按主题归属和体系收敛：只留直接属于本主题的资源，关联但属于其他主题或细分知识的资料不进清单；同一个文档站、手册或教程只收录它的总入口，不要把它的子页面逐条列出；具体知识点的页面在写课程时再补进该课的 \u003ccode>## 参考资料\u003c/code>。\u003c/p>\n\u003cp>完成收集或更新后展示：\u003c/p>\n\u003cul>\n\u003cli>拟使用的资源清单\u003c/li>\n\u003cli>第一阶段最重要的资源\u003c/li>\n\u003cli>明显的空白或薄弱区域\u003c/li>\n\u003c/ul>\n\u003cp>用户已经明确指定的添加、移除或替换不需要再次确认；由 Agent 设计的新资源清单或实质性选材变化应纳入本轮规划结果请求用户确认。如果资源仍有缺口但用户希望继续推进，就说明缺口，后续找到合适资源再补充进清单。\u003c/p>\n\u003cp>完成标准：\u003ccode>RESOURCES.md\u003c/code> 足以支撑当前路线设计并已标明缺口，本次由 Agent 决定的实质性资源选择已经纳入确认范围。\u003c/p>\n\u003ch3>编写或调整学习路线\u003c/h3>\n\u003cp>进入本阶段时完整读取 ROADMAP-FORMAT.md，结合主题的能力地图、\u003ccode>NOTE.md\u003c/code> 中已确认的约束、足以支撑路线的 \u003ccode>RESOURCES.md\u003c/code>，以及你的参数化知识，创建或更新根目录 \u003ccode>ROADMAP.md\u003c/code>。前置文件已经满足需要时直接沿用，不重新执行主题初始化或资源收集。\u003c/p>\n\u003cp>\u003ccode>ROADMAP.md\u003c/code> 中的学习路线应该：\u003c/p>\n\u003cul>\n\u003cli>H1 用纯粹主题名，路线列表直接跟在标题后面\u003c/li>\n\u003cli>用嵌套 Markdown 列表表达阶段、按需主题组和课程顺序\u003c/li>\n\u003cli>阶段课程少或没有自然分组时直接平铺课程；课程较多且能自然成组时才增加编号主题组\u003c/li>\n\u003cli>主题组必须编号，例如 \u003ccode>2.1 查询与筛选\u003c/code>；主题组下的课程编号跟随层级，例如 \u003ccode>2.1.1 条件查询\u003c/code>\u003c/li>\n\u003cli>每个课程项是 Markdown 链接，格式为 \u003ccode>[{节点编号} {短标题}](cheatsheets/{cheat-sheet-slug}/README.mdx)\u003c/code>\u003c/li>\n\u003cli>课程链接下一行只写一句话介绍课程内容\u003c/li>\n\u003cli>使用短而直白的课程标题，例如“安装”“第一次运行”“筛选”“事务”\u003c/li>\n\u003cli>不写图例、类型标记、依赖、产出、资源、假设或缺口\u003c/li>\n\u003cli>最多三层：阶段 -&gt; 主题组 -&gt; 课程\u003c/li>\n\u003c/ul>\n\u003cp>完成标准：用户确认新建或实质修改后的 \u003ccode>ROADMAP.md\u003c/code> 已完整覆盖主题能力地图且结构可接受。在当前路线以及受它依赖的规划文件确认之前，不要创建课程。\u003c/p>\n\u003ch3>编写或更新课程\u003c/h3>\n\u003cp>选课行为：路线确认后，用户指定课程、课节或主题时就准备对应课程；用户未指定时，按照学习路线顺序准备下一节尚未完成的课程。课程的创建顺序不改变已确认路线，也不以课程尚未创建为理由裁剪路线。\u003c/p>\n\u003ch4>确认课程大纲\u003c/h4>\n\u003cp>整理课程大纲前，必须完整读取 CHEATSHEET-FORMAT.md，并结合已确认的 \u003ccode>NOTE.md\u003c/code>、\u003ccode>RESOURCES.md\u003c/code>、\u003ccode>ROADMAP.md\u003c/code>、相关参考资料和现有课程内容，在当前对话中进行一轮聚焦头脑风暴。围绕本课的核心判断、内容边界、关键问题顺序、实际小节、范例媒介和可观察证据探索合理方案；这里的头脑风暴属于本技能流程，不调用外部 brainstorming 技能。\u003c/p>\n\u003cp>头脑风暴发现的信息缺口或选择如果会改变课程主线、主要小节、主题边界、范例媒介或证据设计，先向用户提出具体问题并等待答复，不要把未敲定的选择直接写进课程大纲。所有这类问题核对完成后，才汇总并展示课程大纲；没有不确定项时可以直接汇总大纲。\u003c/p>\n\u003cp>展示前先在内部完成课程设计检查：确定本课核心判断和关键问题顺序，按 \u003ccode>CHEATSHEET-FORMAT.md\u003c/code> 核对内容归属与全面性，并把需要运行、操作或观察的结论映射到范例或可核对证据。检查结果落实到课程目录的标题、小节说明和范例概要中；用户可见大纲使用下方模板。\u003c/p>\n\u003cp>根目录 \u003ccode>ROADMAP.md\u003c/code> 是整套手册已经由用户确认的总大纲。创建新课程或整体重写现有课程前，还要在当前对话中提出一份简短的单课大纲并请求用户确认；大纲本身不创建新文件。用户明确确认最新版本之前，不创建或改写课程 \u003ccode>README.mdx\u003c/code>、范例和 Storybook 入口。用户要求调整时，更新受影响的大纲内容并再次请求确认。\u003c/p>\n\u003cp>课程大纲直接展示接近最终 \u003ccode>README.mdx\u003c/code> 的目录结构：\u003c/p>\n\u003cpre>\u003ccode class=\"language-md\">{一句话介绍本课是什么、做什么。}\n\n- 快速上手：{本课需要时列出；一句话说明最小闭环，存在范例时补充范例概要。}\n- {实际主题小节标题}：{一句话说明是什么、做什么，存在范例时补充范例概要。}\n  - {实际子章节标题}：{仅在该小节确有子结构时列出；一句话说明是什么、做什么，存在范例时补充范例概要。}\n- 最佳实践：{本课存在跨参数或跨步骤的取舍时列出；一句话说明覆盖哪些选择。}\n- 常见问题：{本课存在真实高频且原因、判断或处理不直观的疑问或故障时列出；一句话概述问题范围。}\n- 总结回顾：用摘要、一句话和知识要点总结本课。\n\u003c/code>\u003c/pre>\n\u003cp>目录中的条目和层级必须按正文出现顺序对应实际 \u003ccode>##\u003c/code> / \u003ccode>###\u003c/code> 标题，并根据本课主题和 \u003ccode>CHEATSHEET-FORMAT.md\u003c/code> 的课程模板确定实际小节。参考资料由课程实现阶段按引用规则生成。每个范例概要写在所属小节的说明中。\u003c/p>\n\u003cp>完成标准：用户已经明确确认最新版本的课程大纲；大纲用一句导读和按正文顺序排列的目录呈现实际正文结构，每个实际小节说明其职责，必要范例能够定位到所属小节。内部课程设计检查覆盖核心判断、关键问题、内容归属和可观察证据，其结果已经体现在目录中。大纲暴露出课程节点过宽、需要拆课或改变已确认路线时，把拆课与路线调整一并交给用户确认，确认后先更新 \u003ccode>ROADMAP.md\u003c/code> 再写课。\u003c/p>\n\u003cp>只修复用户明确指出的局部事实、措辞、链接或现有范例缺陷，并且不改变课程主线、主要小节、主题边界或证据设计时，沿用已经确认的课程结构，不重新请求大纲确认；修改触及其中任一项时，重新提出并确认受影响课程的大纲。\u003c/p>\n\u003ch4>准备课程文件\u003c/h4>\n\u003cp>所有课程统一使用 Storybook Docs。进入本阶段时复用已经初始化的学习工作区；工程基础缺失或与当前约束冲突时，先执行独立的初始化阶段，不在课程阶段内创建或合并共享工程基础设施。\u003c/p>\n\u003cp>每节课位于：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">cheatsheets/&lt;cheat-sheet-name&gt;/README.mdx\n\u003c/code>\u003c/pre>\n\u003cp>模板中的 cheatsheets/sample-course/ 是一门接好 Story、Canvas、Controls 和源码入口的可运行示例课。创建实际课程时，把这个目录重命名或复制为 \u003ccode>cheatsheets/&lt;cheat-sheet-name&gt;/\u003c/code>，再按已确认课程大纲与 \u003ccode>ROADMAP.md\u003c/code> 重命名 story 和核心文件，并替换示例 slug、中文导航层级、正文、输入、证据和参考资料。课程不需要内嵌实例时，正文改用 docs-only \u003ccode>Meta\u003c/code>，移除 Canvas / Controls 引用和示例源码文件。模板提供工程与课程代码起点，课程内容仍以已确认大纲和 CHEATSHEET-FORMAT.md 为准。\u003c/p>\n\u003cp>保证 \u003ccode>ROADMAP.md\u003c/code> 链接与课程 \u003ccode>README.mdx\u003c/code> 一致。\u003c/p>\n\u003cp>把这节课的示例项目或范例文件放在同一个 \u003ccode>cheatsheets/&lt;cheat-sheet-name&gt;/\u003c/code> 目录下，并按照 \u003ccode>CHEATSHEET-FORMAT.md\u003c/code> 完成本课。写课前若发现节点过宽（多个可独立查找的主题挤在一起），先提出拆课与路线调整，确认后再写。\u003c/p>\n\u003c/article>","code-review":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>code-review\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>Review a branch, PR, specified revisions, or uncommitted changes for correctness, risks, project standards, and requirements. Use when the user asks for a code review or review since a given point.\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003ch1>Code Review\u003c/h1>\n\u003cp>Review the requested changes from two perspectives: \u003cstrong>Code Quality\u003c/strong> (correctness, risks, and project standards) and \u003cstrong>Spec\u003c/strong> (alignment with the requirements). Review is read-only: do not modify the checkout, index, commits, or branch, or fix findings unless the user requests it.\u003c/p>\n\u003ch2>1. Determine the scope\u003c/h2>\n\u003cp>Respect an explicit scope, including whether committed or uncommitted changes are requested. Otherwise infer it from the request and repository context; ask only when an ambiguity would change what is reviewed.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Branch or PR against a target branch:\u003c/strong> compare the merge-base to the head, e.g. \u003ccode>git diff &lt;base&gt;...&lt;head&gt;\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Two specified versions:\u003c/strong> compare them directly with \u003ccode>git diff &lt;base&gt; &lt;head&gt;\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Uncommitted work:\u003c/strong> inspect staged changes (\u003ccode>git diff --cached\u003c/code>), unstaged changes (\u003ccode>git diff\u003c/code>), and relevant untracked files (\u003ccode>git ls-files --others --exclude-standard\u003c/code>; read their contents separately). Review the actual requested state, including interactions across these changes.\u003c/li>\n\u003c/ul>\n\u003cp>Resolve and record commit SHAs for revision comparisons and validate the requested refs. Identify the files and diff commands once and give both reviewers the same scope. For uncommitted work, include the untracked files when determining whether there is anything to review. If the requested scope is empty, say so; do not report a successful review of nonexistent changes. If a ref is invalid, explain the problem.\u003c/p>\n\u003ch2>2. Gather context\u003c/h2>\n\u003cp>Read the relevant surrounding code and tests as needed to understand behavior. Find applicable project instructions and coding standards, including \u003ccode>CODING_STANDARDS.md\u003c/code> and \u003ccode>CONTRIBUTING.md\u003c/code> when present. Identify the originating requirements from the user's request, linked issue or spec, or a relevant project document. Do not assume an unrelated document is the spec. If no requirements are available, skip the Spec review, continue Code Quality, and note the limitation.\u003c/p>\n\u003ch2>3. Review\u003c/h2>\n\u003cp>When subagents are available and permitted, run the two reviews in parallel with fresh contexts. Give each the exact scope, relevant requirements or standards, and the instructions below. If delegation is unavailable or disallowed, perform both perspectives sequentially yourself. If there are no requirements to review against, run only Code Quality.\u003c/p>\n\u003ch3>Code Quality\u003c/h3>\n\u003cp>Inspect the changed code in context for applicable problems in logic, boundary cases, error handling, security, concurrency, compatibility, data integrity, performance, and integration. Do not mechanically report every category. Check relevant tests and project rules; judge whether a test gap matters based on those rules and the change's risk. Missing new tests alone is not a finding, and adding tests is not mandatory.\u003c/p>\n\u003cp>When a change affects stored data or schemas, check whether existing data and deployments need a migration, including compatibility and rollback where relevant.\u003c/p>\n\u003cp>Check documented standards and cite the source and rule for violations. Use smells such as unclear names, duplication, feature envy, data clumps, primitive obsession, repeated switches, shotgun surgery, divergent change, speculative generality, message chains, middle men, and refused bequest only as investigation cues. Report a smell only when it causes a concrete maintenance cost or defect risk; do not prescribe a refactor solely because a pattern matches. Project rules take precedence.\u003c/p>\n\u003ch3>Spec\u003c/h3>\n\u003cp>Compare the change with the available requirements. Identify missing or partial requirements and incorrect implementations, citing the relevant requirement. Report unrequested behavior only when it creates a concrete risk, cost, or conflict with the goal. For a problem based on a reasonable user expectation absent from the spec, explain the specific scenario and impact rather than presenting a preference as a requirement.\u003c/p>\n\u003ch3>Evidence and validation\u003c/h3>\n\u003cp>For each candidate, gather the evidence needed to substantiate it, such as the affected location, triggering conditions, or consequence where applicable. Read enough surrounding code to understand the issue and distinguish verified facts from uncertainty. Run appropriate checks only when useful and consistent with project rules, after considering side effects; do not run destructive commands or change the checkout. Report what was actually run and its result. Evaluate external review feedback against the code and evidence before accepting or disputing it.\u003c/p>\n\u003ch2>4. Consolidate and report\u003c/h2>\n\u003cp>Verify the reviewers' findings, merge duplicates with the same root cause, and sort by actual severity. Use consecutive numbers for the entire report so the user can refer to each finding. Classify priority by impact and urgency: P0 for a release-blocking emergency, P1 for a serious issue requiring prompt correction, P2 for a normal actionable issue, and P3 for a low-impact issue. Do not inflate severity.\u003c/p>\n\u003cp>Write the final report in the \u003cstrong>user's language\u003c/strong>, including headings, finding explanations, and the summary, regardless of the language of this skill, code, or subagent reports. Preserve code identifiers, paths, error messages, and quotations accurately.\u003c/p>\n\u003cp>Present findings in a table with four columns: number, priority, problem description, and fix direction. Write for a human reader: use short, concrete sentences that are easy to understand. Include the location, trigger, impact, rule, or requirement in the description as needed to make the issue clear; do not force details that do not apply. If the fix is uncertain, say what needs investigation rather than inventing one. Keep cells concise; when a complex finding needs more evidence, explain it below the table using its number. Avoid abstract labels, repeated explanations, and unnecessary background. For example:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">| No. | Priority | Problem | Fix direction |\n| --- | --- | --- | --- |\n| 1 | P1 | Concurrent requests can overwrite order updates in orders/service.py:84. | Add version checking or a suitable lock. |\n\u003c/code>\u003c/pre>\n\u003cp>Finish briefly with the reviewed scope, checks actually run and their results, and material limitations such as a missing spec. If there are no findings, say so explicitly; do not imply unrun checks passed.\u003c/p>\n\u003c/article>","diagnosing-bugs":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>diagnosing-bugs\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>Diagnosis loop for hard bugs and performance regressions. Use when the user says \"diagnose\"/\"debug this\", or reports something broken/throwing/failing/slow.\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003ch1>Diagnosing Bugs\u003c/h1>\n\u003cp>A discipline for hard bugs. Skip phases only when explicitly justified.\u003c/p>\n\u003cp>When exploring the codebase, read \u003ccode>GLOSSARY.md\u003c/code> (if it exists) to get a clear mental model of the relevant modules, and check ADRs in the area you're touching.\u003c/p>\n\u003ch2>Redact\u003c/h2>\n\u003cp>This skill has you show commands, outputs and captured artifacts. \u003cstrong>Redact every secret first\u003c/strong>: write \u003ccode>&lt;REDACTED&gt;\u003c/code> in its place. Build loops against env vars, so the credential stays in the environment rather than in what you show. Captured artifacts carry auth headers: quote only the lines that carry the signal.\u003c/p>\n\u003cp>If the redacted output is not enough to diagnose the bug, say so and ask the user.\u003c/p>\n\u003ch2>Phase 1: Build a feedback loop\u003c/h2>\n\u003cp>\u003cstrong>This is the skill.\u003c/strong> Everything else is mechanical. If you have a \u003cstrong>tight\u003c/strong> pass/fail signal for the bug (one that goes red on \u003cem>this\u003c/em> bug), you will find the cause; bisection, hypothesis-testing, and instrumentation all just consume it. If you don't have one, no amount of staring at code will save you.\u003c/p>\n\u003cp>Spend disproportionate effort here. \u003cstrong>Be aggressive. Be creative. Refuse to give up.\u003c/strong>\u003c/p>\n\u003ch3>Ways to construct one, in roughly this order\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>Failing test\u003c/strong> at whatever seam reaches the bug: unit, integration, e2e.\u003c/li>\n\u003cli>\u003cstrong>Curl / HTTP script\u003c/strong> against a running dev server.\u003c/li>\n\u003cli>\u003cstrong>CLI invocation\u003c/strong> with a fixture input, diffing stdout against a known-good snapshot.\u003c/li>\n\u003cli>\u003cstrong>Headless browser script\u003c/strong> (Playwright / Puppeteer) that drives the UI and asserts on DOM/console/network.\u003c/li>\n\u003cli>\u003cstrong>Replay a captured trace.\u003c/strong> Save a real network request / payload / event log to disk; replay it through the code path in isolation.\u003c/li>\n\u003cli>\u003cstrong>Throwaway harness.\u003c/strong> Spin up a minimal subset of the system (one service, mocked deps) that exercises the bug code path with a single function call.\u003c/li>\n\u003cli>\u003cstrong>Property / fuzz loop.\u003c/strong> If the bug is \"sometimes wrong output\", run 1000 random inputs and look for the failure mode.\u003c/li>\n\u003cli>\u003cstrong>Bisection harness.\u003c/strong> If the bug appeared between two known states (commit, dataset, version), automate \"boot at state X, check, repeat\" so you can \u003ccode>git bisect run\u003c/code> it.\u003c/li>\n\u003cli>\u003cstrong>Differential loop.\u003c/strong> Run the same input through old-version vs new-version (or two configs) and diff outputs.\u003c/li>\n\u003cli>\u003cstrong>HITL bash script.\u003c/strong> Last resort. If a human must click, drive \u003cem>them\u003c/em> with \u003ccode>scripts/hitl-loop.template.sh\u003c/code> so the loop is still structured. Captured output feeds back to you.\u003c/li>\n\u003c/ol>\n\u003cp>Build the right feedback loop, and the bug is 90% fixed.\u003c/p>\n\u003ch3>Tighten the loop\u003c/h3>\n\u003cp>Treat the loop as a product. Once you have \u003cem>a\u003c/em> loop, \u003cstrong>tighten\u003c/strong> it:\u003c/p>\n\u003cul>\n\u003cli>Can I make it faster? (Cache setup, skip unrelated init, narrow the test scope.)\u003c/li>\n\u003cli>Can I make the signal sharper? (Assert on the specific symptom, not \"didn't crash\".)\u003c/li>\n\u003cli>Can I make it more deterministic? (Pin time, seed RNG, isolate filesystem, freeze network.)\u003c/li>\n\u003c/ul>\n\u003cp>A 30-second flaky loop is barely better than no loop; a 2-second deterministic one is tight, a debugging superpower.\u003c/p>\n\u003ch3>Non-deterministic bugs\u003c/h3>\n\u003cp>The goal is not a clean repro but a \u003cstrong>higher reproduction rate\u003c/strong>. Loop the trigger 100×, parallelise, add stress, narrow timing windows, inject sleeps. A 50%-flake bug is debuggable; 1% is not, so keep raising the rate until it's debuggable.\u003c/p>\n\u003ch3>When you genuinely cannot build a loop\u003c/h3>\n\u003cp>Stop and say so explicitly. List what you tried. Ask the user for: (a) access to whatever environment reproduces it, (b) a redacted captured artifact (HAR file, log dump, core dump, screen recording with timestamps), or (c) permission to add temporary production instrumentation. Do \u003cstrong>not\u003c/strong> proceed to hypothesise without a loop.\u003c/p>\n\u003ch3>Completion criterion: a tight loop that goes red\u003c/h3>\n\u003cp>Phase 1 is done when the loop is \u003cstrong>tight\u003c/strong> and \u003cstrong>red-capable\u003c/strong>: you can name \u003cstrong>one command\u003c/strong> (a script path, a test invocation, a curl) that you have \u003cstrong>already run at least once\u003c/strong> (show the invocation and its output, redacted), and that is:\u003c/p>\n\u003cul>\n\u003cli> \u003cstrong>Red-capable\u003c/strong>: it drives the actual bug code path and asserts the \u003cstrong>user's exact symptom\u003c/strong>, so it can go red on this bug and green once fixed. Not \"runs without erroring\"; it must be able to \u003cem>catch this specific bug\u003c/em>.\u003c/li>\n\u003cli> \u003cstrong>Deterministic\u003c/strong>: same verdict every run (flaky bugs: a pinned, high reproduction rate, per above).\u003c/li>\n\u003cli> \u003cstrong>Fast\u003c/strong>: seconds, not minutes.\u003c/li>\n\u003cli> \u003cstrong>Agent-runnable\u003c/strong>: you can run it unattended; a human in the loop only via \u003ccode>scripts/hitl-loop.template.sh\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>If you catch yourself reading code to build a theory before this command exists, \u003cstrong>stop: jumping straight to a hypothesis is the exact failure this skill prevents.\u003c/strong> No red-capable command, no Phase 2.\u003c/p>\n\u003ch2>Phase 2: Reproduce + minimise\u003c/h2>\n\u003cp>Run the loop. Watch it go red as the bug appears.\u003c/p>\n\u003cp>Confirm:\u003c/p>\n\u003cul>\n\u003cli> The loop produces the failure mode the \u003cstrong>user\u003c/strong> described, not a different failure that happens to be nearby. Wrong bug = wrong fix.\u003c/li>\n\u003cli> The failure is reproducible across multiple runs (or, for non-deterministic bugs, reproducible at a high enough rate to debug against).\u003c/li>\n\u003cli> You have captured the exact symptom (error message, wrong output, slow timing) so later phases can verify the fix actually addresses it.\u003c/li>\n\u003c/ul>\n\u003ch3>Minimise\u003c/h3>\n\u003cp>Once it's red, shrink the repro to the \u003cstrong>smallest scenario that still goes red\u003c/strong>. Cut inputs, callers, config, data, and steps \u003cstrong>one at a time\u003c/strong>, re-running the loop after each cut, and keep only what's load-bearing for the failure.\u003c/p>\n\u003cp>Why bother: a minimal repro shrinks the hypothesis space in Phase 3 (fewer moving parts left to suspect) and becomes the clean regression test in Phase 5.\u003c/p>\n\u003cp>Done when \u003cstrong>every remaining element is load-bearing\u003c/strong>: removing any one of them makes the loop go green.\u003c/p>\n\u003cp>Do not proceed until you have reproduced \u003cstrong>and\u003c/strong> minimised.\u003c/p>\n\u003ch2>Phase 3: Hypothesise\u003c/h2>\n\u003cp>Generate \u003cstrong>3–5 ranked hypotheses\u003c/strong> before testing any of them. Single-hypothesis generation anchors on the first plausible idea.\u003c/p>\n\u003cp>Each hypothesis must be \u003cstrong>falsifiable\u003c/strong>: state the prediction it makes.\u003c/p>\n\u003cblockquote>\n\u003cp>Format: \"If  is the cause, then  will make the bug disappear /  will make it worse.\"\u003c/p>\n\u003c/blockquote>\n\u003cp>If you cannot state the prediction, the hypothesis is a vibe: discard or sharpen it.\u003c/p>\n\u003cp>\u003cstrong>Show the ranked list to the user before testing.\u003c/strong> They often have domain knowledge that re-ranks instantly (\"we just deployed a change to #3\"), or know hypotheses they've already ruled out. Cheap checkpoint, big time saver. Don't block on it; proceed with your ranking if the user is AFK.\u003c/p>\n\u003ch2>Phase 4: Instrument\u003c/h2>\n\u003cp>Each probe must map to a specific prediction from Phase 3. \u003cstrong>Change one variable at a time.\u003c/strong>\u003c/p>\n\u003cp>Tool preference:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Debugger / REPL inspection\u003c/strong> if the env supports it. One breakpoint beats ten logs.\u003c/li>\n\u003cli>\u003cstrong>Targeted logs\u003c/strong> at the boundaries that distinguish hypotheses.\u003c/li>\n\u003cli>Never \"log everything and grep\".\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Tag every debug log\u003c/strong> with a unique prefix, e.g. \u003ccode>[DEBUG-a4f2]\u003c/code>. Cleanup at the end becomes a single grep. Untagged logs survive; tagged logs die.\u003c/p>\n\u003cp>\u003cstrong>Perf branch.\u003c/strong> For performance regressions, logs are usually wrong. Instead: establish a baseline measurement (timing harness, \u003ccode>performance.now()\u003c/code>, profiler, query plan), then bisect. Measure first, fix second.\u003c/p>\n\u003ch2>Phase 5: Fix + regression test\u003c/h2>\n\u003cp>Write the regression test \u003cstrong>before the fix\u003c/strong>, but only if there is a \u003cstrong>correct seam\u003c/strong> for it.\u003c/p>\n\u003cp>A correct seam is one where the test exercises the \u003cstrong>real bug pattern\u003c/strong> as it occurs at the call site. If the only available seam is too shallow (single-caller test when the bug needs multiple callers, unit test that can't replicate the chain that triggered the bug), a regression test there gives false confidence.\u003c/p>\n\u003cp>\u003cstrong>If no correct seam exists, that itself is the finding.\u003c/strong> Note it. The codebase architecture is preventing the bug from being locked down. Flag this for the next phase.\u003c/p>\n\u003cp>If a correct seam exists:\u003c/p>\n\u003col>\n\u003cli>Turn the minimised repro into a failing test at that seam.\u003c/li>\n\u003cli>Watch it fail. If you forced the red by mutating code or a fixture, \u003ccode>diff\u003c/code> against a pristine copy to prove the mutation landed before you trust it.\u003c/li>\n\u003cli>Apply the fix.\u003c/li>\n\u003cli>Watch it pass.\u003c/li>\n\u003cli>Re-run the Phase 1 feedback loop against the original (un-minimised) scenario.\u003c/li>\n\u003c/ol>\n\u003ch2>Phase 6: Cleanup\u003c/h2>\n\u003cp>Required before declaring done:\u003c/p>\n\u003cul>\n\u003cli> Original repro no longer reproduces (re-run the Phase 1 loop)\u003c/li>\n\u003cli> Regression test passes (or absence of seam is documented)\u003c/li>\n\u003cli> All \u003ccode>[DEBUG-...]\u003c/code> instrumentation removed (\u003ccode>grep\u003c/code> the prefix)\u003c/li>\n\u003cli> Throwaway prototypes deleted (or moved to a clearly-marked debug location)\u003c/li>\n\u003cli> The hypothesis that turned out correct is stated in the commit / PR message, so the next debugger learns\u003c/li>\n\u003c/ul>\n\u003c/article>","diagram-design":"\u003csection class=\"meta\">\u003cheader>元信息\u003c/header>\u003cdl>\u003cdt>name\u003c/dt>\u003cdd>diagram-design\u003c/dd>\u003cdt>description\u003c/dt>\u003cdd>Create branded architecture, architecture delta, IT current-state, flowchart, sequence, state machine, ER/data model, timeline, swimlane, quadrant, radar/spider, polar chart (polar/radial lollipop), loop/flywheel, nested, tree, org chart, layer stack, exploded axonometric, axonometric plan, Venn, pyramid/funnel, treemap and marimekko, heatmap, bar and dumbbell, waterfall, line (slopegraph, ridgeline, streamgraph, bump), Gantt and scatter charts (bubble, beeswarm), high-level, process, medallion, data flow, DP integration, DP security matrix, Sankey, fishbone, Wardley map, kanban, user journey, deployment, dependency graph, UML class, story map, or database schema diagrams as HTML/SVG/PNG, with .drawio, Mermaid, and .excalidraw import, plus lifecycle phase maps, block decomposition trees, and onboarding guidance.\u003c/dd>\u003cdt>license\u003c/dt>\u003cdd>MIT\u003c/dd>\u003cdt>version\u003c/dt>\u003cdd>2.6\u003c/dd>\u003c/dl>\u003c/section>\u003carticle>\u003ch1>Diagram Design\u003c/h1>\n\u003cp>Create diagrams as self-contained HTML files with inline SVG and an editorial design system.\u003c/p>\n\u003cp>Forty-four visual types. Semantic patterns describe behavior; type references describe layout.\u003c/p>\n\u003chr>\n\u003ch2>0. First-time setup — style guide gate\u003c/h2>\n\u003cp>\u003cstrong>Before generating your first diagram in a new project, verify the style guide has been customized.\u003c/strong>\u003c/p>\n\u003cp>Do not silently ship default-skinned diagrams into a branded project.\u003c/p>\n\u003cp>First resolve any project \u003ccode>.diagram-design\u003c/code> marker per references/profiles.md; a successfully resolved marker selects its profile and bypasses this gate. That reference owns failures, the protected default, and save behavior.\u003c/p>\n\u003cp>Open references/style-guide.md and check the default tokens. If they are still the shipped defaults (paper \u003ccode>#f5f5f5\u003c/code>, ink \u003ccode>#2d3142\u003c/code>, accent \u003ccode>#bf4520\u003c/code>), \u003cstrong>pause and ask the user\u003c/strong>:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cem>\"This is your first diagram in this project and the style guide is still default. Customize now? Options: (a) website URL, (b) installed skill, (c) local folder/design-system, (d) paste tokens, (e) keep default, (f) load saved profile.\"\u003c/em>\u003c/p>\n\u003c/blockquote>\n\u003cp>Then branch per the matching section of references/onboarding.md; for \u003cstrong>(f)\u003c/strong> follow references/profiles.md.\u003c/p>\n\u003cp>\u003cstrong>Once the style guide has been customized\u003c/strong> (or the user explicitly chose default), skip this gate on later runs. A leading profile header names the copied-in active profile. Without a header, any semantic-role value or typography family differing from shipped defaults means \u003cstrong>custom-unsaved\u003c/strong>: skip the gate and offer to save it as a profile. All-default tokens with no marker/header trigger the gate. After onboarding, offer to save as a named client profile per \u003ccode>references/profiles.md\u003c/code>.\u003c/p>\n\u003chr>\n\u003ch2>1. Philosophy\u003c/h2>\n\u003cp>\u003cstrong>The highest-quality move is usually deletion.\u003c/strong>\u003c/p>\n\u003cp>Applied to schematics:\u003c/p>\n\u003cul>\n\u003cli>Every node represents a distinct idea. Two nodes that always travel together are one node.\u003c/li>\n\u003cli>Every connection carries information. If the relationship is obvious from layout, remove the line.\u003c/li>\n\u003cli>Coral is \u003cstrong>editorial, not a flag.\u003c/strong> 1–2 focal nodes per diagram. Using it on 5 nodes erases the signal.\u003c/li>\n\u003cli>The schematic isn't done when everything is added. It's done when nothing can be removed.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Target density: 4/10.\u003c/strong> Enough to be technically complete. Not so dense it needs a guide. Above 9 nodes, it's probably two diagrams.\u003c/p>\n\u003chr>\n\u003ch2>2. When to Use\u003c/h2>\n\u003cp>Use for any of the 44 visual types (§3) when a reader will learn more from a visual than from prose, a table, or a bulleted list.\u003c/p>\n\u003cp>\u003cstrong>Don't use for:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Quick unicode diagrams → use \u003cstrong>wiretext\u003c/strong>.\u003c/li>\n\u003cli>Lists of things → table or bullets.\u003c/li>\n\u003cli>Attribute-only before/after → table; topology changes → Architecture delta.\u003c/li>\n\u003cli>One-shape \"diagrams\" → just write the sentence.\u003c/li>\n\u003c/ul>\n\u003cp>Before drawing, ask: \u003cem>Would the reader learn more from this than from a well-written paragraph?\u003c/em> If no, don't draw.\u003c/p>\n\u003chr>\n\u003ch2>3. Selection: semantic pattern, then visual type\u003c/h2>\n\u003cp>When behavior, state, enforcement, or risk carries the meaning, first load references/semantic-patterns.md and choose one primary pattern. Then choose the nearest visual type for layout. If no pattern matches, choose the type directly.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Behavioral trigger\u003c/th>\n\u003cth>Semantic pattern → nearest type\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Fan-in, queue depth, finite capacity, bottleneck\u003c/td>\n\u003ctd>\u003cstrong>Fan-in queue / bottleneck\u003c/strong> → Data flow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repeated Question / Input / Governance / Output slots across stages\u003c/td>\n\u003ctd>\u003cstrong>Stage framework with semantic slots\u003c/strong> → Process\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Conversation or loose input becomes a structured durable artifact\u003c/td>\n\u003ctd>\u003cstrong>Unstructured input → structured artifact\u003c/strong> → Data flow\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two rule traces need pass/fail/skipped/not-reached and first divergence\u003c/td>\n\u003ctd>\u003cstrong>Paired policy-evaluation traces\u003c/strong> → Flowchart\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Trust boundaries plus permitted/forbidden ingress or deploy paths\u003c/td>\n\u003ctd>\u003cstrong>Secure paved road\u003c/strong> → Architecture\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Controls grouped by where they are enforced\u003c/td>\n\u003ctd>\u003cstrong>Governance / control catalog\u003c/strong> → Layer stack\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Defenses compensate for prior gaps and residual risk propagates\u003c/td>\n\u003ctd>\u003cstrong>Compensating security layers\u003c/strong> → Layer stack\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hierarchical, ID-addressable decomposition needing per-block I/O, constraints, and a code link\u003c/td>\n\u003ctd>\u003cstrong>Traceable block decomposition\u003c/strong> → Tree\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One subject progresses through phases, waits, retries, cancellation, and terminal outcomes\u003c/td>\n\u003ctd>\u003cstrong>Lifecycle phase map\u003c/strong> → State Machine\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The pattern owns semantic primitives and its tighter budget; the type owns layout grammar. Use references/animation.md only when motion is requested or materially clarifies ordered change; static remains the default.\u003c/p>\n\u003ch3>Visual-type guide (44)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>If you're showing…\u003c/th>\n\u003cth>Use\u003c/th>\n\u003cth>Reference\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Components + connections in one system snapshot\u003c/td>\n\u003ctd>\u003cstrong>Architecture\u003c/strong>\u003c/td>\n\u003ctd>type-architecture.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Structural change between synchronized Before / After topologies, with a Changes ledger\u003c/td>\n\u003ctd>\u003cstrong>Architecture delta\u003c/strong>\u003c/td>\n\u003ctd>type-architecture-delta.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Legacy IT landscape by phase or department; shows the \u003cem>before\u003c/em> state\u003c/td>\n\u003ctd>\u003cstrong>IT current-state\u003c/strong>\u003c/td>\n\u003ctd>type-it-state.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Decision logic with branches\u003c/td>\n\u003ctd>\u003cstrong>Flowchart\u003c/strong>\u003c/td>\n\u003ctd>type-flowchart.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Time-ordered messages between actors\u003c/td>\n\u003ctd>\u003cstrong>Sequence\u003c/strong>\u003c/td>\n\u003ctd>type-sequence.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>States + transitions + guards\u003c/td>\n\u003ctd>\u003cstrong>State machine\u003c/strong>\u003c/td>\n\u003ctd>type-state.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Entities + fields + relationships\u003c/td>\n\u003ctd>\u003cstrong>ER / data model\u003c/strong>\u003c/td>\n\u003ctd>type-er.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Events positioned in time\u003c/td>\n\u003ctd>\u003cstrong>Timeline\u003c/strong>\u003c/td>\n\u003ctd>type-timeline.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cross-functional process with handoffs\u003c/td>\n\u003ctd>\u003cstrong>Swimlane\u003c/strong>\u003c/td>\n\u003ctd>type-swimlane.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Two-axis positioning / prioritization\u003c/td>\n\u003ctd>\u003cstrong>Quadrant\u003c/strong>\u003c/td>\n\u003ctd>type-quadrant.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multiple entities scored across 3–5 quantitative criteria\u003c/td>\n\u003ctd>\u003cstrong>Radar / Spider\u003c/strong>\u003c/td>\n\u003ctd>type-radar.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One quantitative series across cyclic categories; angle=category, radius=magnitude\u003c/td>\n\u003ctd>\u003cstrong>Polar chart\u003c/strong>\u003c/td>\n\u003ctd>type-polar.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reinforcing cycle; the last step feeds the first and a hub accumulates state\u003c/td>\n\u003ctd>\u003cstrong>Loop\u003c/strong>\u003c/td>\n\u003ctd>type-loop.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hierarchy through containment / scope\u003c/td>\n\u003ctd>\u003cstrong>Nested\u003c/strong>\u003c/td>\n\u003ctd>type-nested.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Parent → children relationships\u003c/td>\n\u003ctd>\u003cstrong>Tree\u003c/strong>\u003c/td>\n\u003ctd>type-tree.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Human/agent/team ownership, reporting, routing, escalation\u003c/td>\n\u003ctd>\u003cstrong>Org chart\u003c/strong>\u003c/td>\n\u003ctd>type-org-chart.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stacked abstraction levels\u003c/td>\n\u003ctd>\u003cstrong>Layer stack\u003c/strong>\u003c/td>\n\u003ctd>type-layers.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Parts of one object pulled apart along one axis: a teardown, an unboxing, assembly order\u003c/td>\n\u003ctd>\u003cstrong>Exploded axonometric\u003c/strong>\u003c/td>\n\u003ctd>type-exploded.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>One floor or site seen from above at an angle: rooms with furniture, buildings by phase\u003c/td>\n\u003ctd>\u003cstrong>Axonometric plan\u003c/strong>\u003c/td>\n\u003ctd>type-axonometric-plan.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overlap between sets\u003c/td>\n\u003ctd>\u003cstrong>Venn\u003c/strong>\u003c/td>\n\u003ctd>type-venn.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ranked hierarchy or conversion drop-off\u003c/td>\n\u003ctd>\u003cstrong>Pyramid / funnel\u003c/strong>\u003c/td>\n\u003ctd>type-pyramid.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quantitative comparison across categories\u003c/td>\n\u003ctd>\u003cstrong>Bar chart\u003c/strong>\u003c/td>\n\u003ctd>type-bar.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A start total bridged to an end total by signed contributions (budget bridge, headcount deltas)\u003c/td>\n\u003ctd>\u003cstrong>Waterfall\u003c/strong>\u003c/td>\n\u003ctd>type-waterfall.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Part-of-whole where the relative sizes are the story\u003c/td>\n\u003ctd>\u003cstrong>Treemap\u003c/strong>\u003c/td>\n\u003ctd>type-treemap.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cross-tabulated data; fill encodes value per cell\u003c/td>\n\u003ctd>\u003cstrong>Heatmap\u003c/strong>\u003c/td>\n\u003ctd>type-heatmap.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Continuous trends over time, change between exactly two states (slopegraph), one distribution per series (ridgeline), or rank movement across several snapshots (bump)\u003c/td>\n\u003ctd>\u003cstrong>Line chart\u003c/strong>\u003c/td>\n\u003ctd>type-line.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tasks and phases on a timeline\u003c/td>\n\u003ctd>\u003cstrong>Gantt\u003c/strong>\u003c/td>\n\u003ctd>type-gantt.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Correlation or distribution of two variables; bubble (three variables) and beeswarm (one variable, dot per item) variants\u003c/td>\n\u003ctd>\u003cstrong>Scatter plot\u003c/strong>\u003c/td>\n\u003ctd>type-scatter.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>End-to-end data stack on a container cluster\u003c/td>\n\u003ctd>\u003cstrong>High-Level\u003c/strong>\u003c/td>\n\u003ctd>type-high-level.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multi-actor sequential process with data handoffs\u003c/td>\n\u003ctd>\u003cstrong>Process\u003c/strong>\u003c/td>\n\u003ctd>type-process.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multi-tier data storage with quality levels and access policies\u003c/td>\n\u003ctd>\u003cstrong>Medallion\u003c/strong>\u003c/td>\n\u003ctd>type-medallion.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Role-scoped data flow: who does what at each pipeline step\u003c/td>\n\u003ctd>\u003cstrong>Data flow\u003c/strong>\u003c/td>\n\u003ctd>type-data-flow.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Integration topology of a data platform — sources → core → consumers\u003c/td>\n\u003ctd>\u003cstrong>DP integration\u003c/strong>\u003c/td>\n\u003ctd>type-dp-integration.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Per-role / per-component access permissions matrix\u003c/td>\n\u003ctd>\u003cstrong>DP security matrix\u003c/strong>\u003c/td>\n\u003ctd>type-dp-security-matrix.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A quantity splitting and merging across stages, band width = amount\u003c/td>\n\u003ctd>\u003cstrong>Sankey\u003c/strong>\u003c/td>\n\u003ctd>type-sankey.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Causes of one observed effect, grouped by category (root-cause analysis)\u003c/td>\n\u003ctd>\u003cstrong>Fishbone\u003c/strong>\u003c/td>\n\u003ctd>type-fishbone.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Value chain against evolution — what to build, buy, and what is moving\u003c/td>\n\u003ctd>\u003cstrong>Wardley map\u003c/strong>\u003c/td>\n\u003ctd>type-wardley.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Work-in-progress by state, with WIP limits and blocked items\u003c/td>\n\u003ctd>\u003cstrong>Kanban\u003c/strong>\u003c/td>\n\u003ctd>type-kanban.md\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>What a person does across stages of an experience, and how it feels\u003c/td>\n\u003ctd>\u003cstrong>User journey\u003c/strong>\u003c/td>\n\u003ctd>type-journ
